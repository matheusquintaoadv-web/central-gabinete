<style>
  :root{
    --tinta:#0E1B36; --tinta-2:#1B2C52; --tinta-3:#31456F;
    --papel:#E7ECF3; --carta:#FFFFFF;
    --ouro:#C8A63C; --ouro-2:#F0E3B8;
    --texto:#0E1B36; --texto-2:#5D6A88; --linha:#D4DBE6;
    --alerta:#B3261E; --ambar:#A8710F; --ok:#1B6B48;
    --topo:56px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--papel);color:var(--texto);
    font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior:none;
  }
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:6px}

  .topo{
    position:fixed;top:0;left:0;right:0;z-index:40;
    padding:var(--safe-t) 14px 0;height:calc(var(--topo) + var(--safe-t));
    background:var(--tinta);display:flex;align-items:center;gap:10px;
    box-shadow:0 1px 0 rgba(255,255,255,.08),0 6px 20px rgba(14,27,54,.18);
  }
  .selo{
    width:26px;height:26px;flex:0 0 26px;border-radius:5px;border:1.5px solid var(--ouro);
    display:grid;place-items:center;color:var(--ouro);font-size:11px;font-weight:700;letter-spacing:.04em;
  }
  .marca{flex:1;min-width:0;text-align:left}
  .marca h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .marca p{
    margin:0;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    color:rgba(255,255,255,.5);font-weight:500;display:flex;align-items:center;gap:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ponto{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#6B7A99}
  .ponto.on{background:#4CAF7D}
  .ponto.enviando{background:var(--ouro);animation:pulsa 1s infinite}
  .ponto.erro{background:#E4796F}
  @keyframes pulsa{50%{opacity:.25}}
  .icone{width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
  .icone:active{background:rgba(255,255,255,.12)}
  .icone svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .busca{
    position:fixed;top:var(--safe-t);left:0;right:0;z-index:41;height:var(--topo);
    background:var(--tinta);display:none;align-items:center;gap:8px;padding:0 10px;
  }
  .busca.on{display:flex}
  .busca input{
    flex:1;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);color:#fff;padding:0 12px;
  }
  .busca input::placeholder{color:rgba(255,255,255,.45)}

  .pastas{
    position:fixed;z-index:39;left:0;right:0;top:calc(var(--topo) + var(--safe-t));
    background:var(--tinta-2);height:36px;display:flex;gap:2px;
    overflow-x:auto;scrollbar-width:none;padding:0 8px;
  }
  .pastas::-webkit-scrollbar{display:none}
  .aba{
    flex:0 0 auto;display:flex;align-items:center;padding:0 12px;
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(255,255,255,.55);white-space:nowrap;border-bottom:2px solid transparent;
  }
  .aba[aria-selected="true"]{color:#fff;border-bottom-color:var(--ouro)}
  .aba.prazos{color:var(--ouro-2)}
  .aba .n{font-family:var(--mono);font-size:10px;margin-left:5px;opacity:.75}

  main{padding-top:calc(var(--topo) + var(--safe-t) + 36px);height:100dvh}

  .trilho{
    display:flex;gap:12px;height:100%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x proximity;padding:12px 14px calc(16px + var(--safe-b));scrollbar-width:none;
  }
  .trilho::-webkit-scrollbar{display:none}
  .coluna{
    flex:0 0 82vw;max-width:330px;scroll-snap-align:center;
    display:flex;flex-direction:column;min-height:0;
    background:rgba(255,255,255,.5);border:1px solid var(--linha);border-radius:14px;
  }
  @media(min-width:720px){ .coluna{flex-basis:296px} }
  .cab{display:flex;align-items:baseline;gap:8px;padding:12px 13px 9px;border-bottom:1px solid var(--linha)}
  .cab h2{
    margin:0;flex:1;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cab .qtd{font-family:var(--mono);font-size:11px;color:var(--texto-2)}
  .cab .mais{font-size:20px;line-height:1;color:var(--texto-2);padding:0 2px}
  .lista{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:10px;display:flex;flex-direction:column;gap:9px;
  }

  .cartao{
    position:relative;background:var(--carta);border-radius:10px;border:1px solid var(--linha);
    box-shadow:0 1px 2px rgba(14,27,54,.06);padding:11px 12px 10px 15px;
    display:flex;flex-direction:column;gap:7px;touch-action:manipulation;
  }
  .cartao::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    border-radius:10px 0 0 10px;background:var(--faixa,var(--linha));
  }
  .cartao.alta::after{
    content:"";position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;
    background:var(--ouro);box-shadow:0 0 0 3px rgba(200,166,60,.18);
  }
  .cartao .tit{font-size:14px;font-weight:500;letter-spacing:-.008em;padding-right:28px}
  .cartao .pe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:24px}
  .protocolo{font-family:var(--mono);font-size:10px;color:#9AA6BE;letter-spacing:.02em}
  .etiqueta{
    font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;
    color:var(--faixa,var(--tinta-3));background:color-mix(in srgb,var(--faixa,#888) 12%,transparent);
  }
  .prazo{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:#EEF1F6;color:var(--texto-2)}
  .prazo.perto{background:#FBF0DA;color:var(--ambar)}
  .prazo.vencido{background:#FBE6E4;color:var(--alerta)}
  .autor{
    font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--tinta-3);
    width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-left:auto;
  }
  .cartao .nota{font-size:11px;color:var(--texto-2)}
  .pega{position:absolute;right:0;top:0;bottom:0;width:34px;display:grid;place-items:center;color:#C3CCDC;touch-action:none}
  .pega svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:round}

  .cartao.origem{opacity:.28}
  .fantasma{position:fixed;z-index:200;pointer-events:none;box-shadow:0 14px 34px rgba(14,27,54,.28);transform:rotate(1.4deg);border-color:var(--ouro)}
  .vazio-lugar{border:1.5px dashed var(--ouro);background:rgba(200,166,60,.09);border-radius:10px;flex:0 0 auto}
  .lista.alvo{background:rgba(200,166,60,.05)}
  .nada{padding:22px 14px;text-align:center;color:var(--texto-2);font-size:12.5px;line-height:1.6}

  .rolo{height:100%;overflow-y:auto;padding:14px 14px calc(30px + var(--safe-b))}
  .grupo{margin-bottom:20px}
  .grupo h3{
    margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--tinta-3);display:flex;align-items:center;gap:9px;
  }
  .grupo h3::after{content:"";flex:1;height:1px;background:var(--linha)}
  .grupo.urgente h3{color:var(--alerta)}
  .linha-item{
    background:var(--carta);border:1px solid var(--linha);border-radius:10px;
    padding:11px 12px;margin-bottom:7px;display:flex;gap:10px;align-items:center;width:100%;text-align:left;
  }
  .linha-item .onde{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2)}
  .linha-item .tit{font-size:13.5px;font-weight:500}

  .fab{
    position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:35;
    width:54px;height:54px;border-radius:17px;background:var(--tinta);color:var(--ouro);
    display:grid;place-items:center;font-size:26px;font-weight:300;box-shadow:0 8px 22px rgba(14,27,54,.34);
  }
  .fab:active{transform:scale(.94)}

  .veu{position:fixed;inset:0;z-index:50;background:rgba(14,27,54,.45);opacity:0;pointer-events:none;transition:opacity .18s}
  .veu.on{opacity:1;pointer-events:auto}
  .folha{

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fantasma{transform:none}}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   CENTRAL DO GABINETE — v2
   Documento local + sincronização opcional com Supabase.
   A mesclagem é por entidade (pasta / coluna / cartão):
   vence sempre a edição com carimbo de tempo mais recente,
   então duas pessoas podem mexer no quadro ao mesmo tempo.
   ============================================================ */

const CHAVE_DOC = "gabinete-doc:v2";
const CHAVE_CFG = "gabinete-cfg:v2";
const PALETA = ["#2A5D8F","#7A4E9C","#1B6B48","#B3261E","#A8710F","#4A5568","#0E7490","#9B3B6E"];
const TOMBO = 45 * 86400000;           // tempo que os registros excluídos ficam guardados
const INTERVALO = 5000;                // ritmo da checagem no servidor

let estado = null;
let cfg = { url:"", chave:"", quadro:"gabinete", senha:"", eu:"", lembrar:true };
let vista = { pasta:null, modo:"quadro", busca:"" };
let semArmazenamento = false;
let salvamento = null;

/* =================== utilidades =================== */

function id(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function agora(){ return Date.now(); }
function HOJE(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function iniciais(n){ return (n||"").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase() || "?"; }

function cor(txt){
  if(!txt) return "#C3CCDC";
  let h = 0;
  for(let i=0;i<txt.length;i++) h = (h*31 + txt.charCodeAt(i)) % 9973;
  return PALETA[h % PALETA.length];
}
function diasAte(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+"T00:00:00") - HOJE()) / 86400000);
}
function rotuloPrazo(iso){
  const d = diasAte(iso);
  if(d === null) return null;
  if(d < -1) return { txt:Math.abs(d)+" d atrás", cls:"vencido" };
  if(d === -1) return { txt:"ontem", cls:"vencido" };
  if(d === 0) return { txt:"hoje", cls:"vencido" };
  if(d === 1) return { txt:"amanhã", cls:"perto" };
  if(d <= 7) return { txt:"em "+d+" d", cls:"perto" };
  const dt = new Date(iso+"T00:00:00");
  return { txt:String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0"), cls:"" };
}
function brinde(msg){
  const el = document.getElementById("brinde");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2600);
}

/* =================== modelo =================== */

const ordenar = (a,b) => (a.ordem - b.ordem) || (a.id < b.id ? -1 : 1);
const vivas   = o => Object.values(o).filter(x => !x.del);
const pastas  = () => vivas(estado.pastas).sort(ordenar);
const colunas = pid => vivas(estado.colunas).filter(k => k.pasta === pid).sort(ordenar);
const cartoes = kid => vivas(estado.cartoes).filter(c => c.coluna === kid).sort(ordenar);

function tocar(o){ o.mod = agora(); o.por = cfg.eu || ""; return o; }

function proximoN(){
  let m = 0;
  Object.values(estado.cartoes).forEach(c => { if(c.n > m) m = c.n; });
  return m + 1;
}

function ordemEntre(antes, depois){
  const a = antes ? estado.cartoes[antes] : null;
  const b = depois ? estado.cartoes[depois] : null;
  if(a && b){
    const meio = (a.ordem + b.ordem) / 2;
    if(meio > a.ordem && meio < b.ordem) return meio;
    return null; // precisa renumerar a coluna
  }
  if(b) return b.ordem - 1;
  if(a) return a.ordem + 1;
  return 0;
}
function renumerar(kid){
  cartoes(kid).forEach((c,i) => { c.ordem = i; tocar(c); });
}

function semente(){
  const hoje = new Date();
  const dia = n => { const d = new Date(hoje); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const doc = { versao:2, virgem:true, titulo:"Central do Gabinete", tituloMod:0,
                subtitulo:"Câmara Municipal de Petrópolis", subMod:0,
                pastas:{}, colunas:{}, cartoes:{} };
  let n = 0;
  const P = (nome, ordem) => { const o = { id:id("p"), nome, ordem, mod:agora(), por:"" }; doc.pastas[o.id] = o; return o.id; };
  const K = (pasta, nome, ordem) => { const o = { id:id("k"), pasta, nome, ordem, mod:agora(), por:"" }; doc.colunas[o.id] = o; return o.id; };
  const C = (coluna, ordem, titulo, etiqueta, prazo, prioridade, notas) => {
    const o = { id:id("c"), coluna, ordem, n:++n, titulo, etiqueta:etiqueta||"", prazo:prazo||"",
                prioridade:prioridade||"normal", notas:notas||"", mod:agora(), por:"" };
    doc.cartoes[o.id] = o;
  };

  const g = P("Gabinete", 0);
  const g1 = K(g,"Entrada",0), g2 = K(g,"Em andamento",1), g3 = K(g,"Aguardando terceiros",2); K(g,"Concluído",3);
  C(g1,0,"Compilar Eixos I–III da agenda legislativa","Compilação");
  C(g2,0,"Parecer sobre o veto às emendas da LDO 2027","Parecer",dia(3),"alta","Checar prazo regimental para apreciação do veto.");
  C(g3,0,"Ata da audiência pública — segurança e população em situação de rua","Audiência",dia(9));

  const pr = P("Proposições", 1);
  const p1 = K(pr,"Ideia",0), p2 = K(pr,"Redação",1), p3 = K(pr,"Revisão jurídica",2); K(pr,"Protocolado",3); K(pr,"Em pauta",4);
  C(p1,0,"Lei do Balcão Único — serviços públicos coordenados","PL");
  C(p2,0,"PL do cadastro municipal de tatuagem e piercing","PL","","normal","Corrigir vício de iniciativa: reposicionar como norma de cadastro/CAMOD.");
  C(p3,0,"Estatuto Municipal da Pessoa Idosa","PL",dia(14),"alta","Consolidação de 103 artigos + revisão de constitucionalidade.");

  const of = P("Ofícios & prazos", 2);
  const o1 = K(of,"A redigir",0); K(of,"Assinatura",1); K(of,"Protocolado",2);
  const o4 = K(of,"Aguardando resposta",3); K(of,"Encerrado",4);
  C(o1,0,"Ofício à Secretaria de Obras — recomposição de via","Obras",dia(2),"alta");
  C(o4,0,"Águas do Imperador — tarifa do Condomínio Corrêas Village","Águas",dia(-4),"alta","STJ, Tema Repetitivo 414. Cobrar resposta.");

  const dm = P("Demandas", 3);
  const d1 = K(dm,"Recebida",0); K(dm,"Em apuração",1); K(dm,"Ofício enviado",2); K(dm,"Resolvida",3);
  C(d1,0,"Iluminação pública — trecho sem manutenção","Iluminação");

  return doc;
}

/* ------- conversão do formato antigo (v1) ------- */
function migrar(v){
  if(!v) return null;
  if(v.versao === 2 && v.pastas && !Array.isArray(v.pastas)) return v;
  if(!Array.isArray(v.pastas)) return null;
  const doc = { versao:2, titulo:v.titulo||"Central do Gabinete", tituloMod:0,
                subtitulo:v.subtitulo||"", subMod:0, pastas:{}, colunas:{}, cartoes:{} };
  v.pastas.forEach((p,pi) => {
    const pid = p.id || id("p");
    doc.pastas[pid] = { id:pid, nome:p.nome, ordem:pi, mod:agora(), por:"" };
    (p.colunas||[]).forEach((k,ki) => {
      const kid = k.id || id("k");
      doc.colunas[kid] = { id:kid, pasta:pid, nome:k.nome, ordem:ki, mod:agora(), por:"" };
      (k.cartoes||[]).forEach((c,ci) => {
        const cid = c.id || id("c");
        doc.cartoes[cid] = { id:cid, coluna:kid, ordem:ci, n:c.n||0, titulo:c.titulo,
                             etiqueta:c.etiqueta||"", prazo:c.prazo||"", prioridade:c.prioridade||"normal",
                             notas:c.notas||"", mod:agora(), por:"" };
      });
    });
  });
  let n = 0;
  Object.values(doc.cartoes).forEach(c => { if(!c.n) c.n = ++n; else n = Math.max(n, c.n); });
  return doc;
}

/* ------- mesclagem ------- */
function fundirMapa(x, y){
  const out = {};
  const chaves = new Set(Object.keys(x||{}).concat(Object.keys(y||{})));
  chaves.forEach(k => {
    const a = (x||{})[k], b = (y||{})[k];
    if(!a){ out[k] = b; return; }
    if(!b){ out[k] = a; return; }
    out[k] = (b.mod||0) > (a.mod||0) ? b : a;
  });
  return out;
}
function fundir(local, remoto){
  if(!remoto || !remoto.pastas) return local;
  return {
    versao:2,
    titulo:    (remoto.tituloMod||0) > (local.tituloMod||0) ? remoto.titulo : local.titulo,
    tituloMod: Math.max(local.tituloMod||0, remoto.tituloMod||0),
    subtitulo: (remoto.subMod||0) > (local.subMod||0) ? remoto.subtitulo : local.subtitulo,
    subMod:    Math.max(local.subMod||0, remoto.subMod||0),
    pastas:  fundirMapa(local.pastas,  remoto.pastas),
    colunas: fundirMapa(local.colunas, remoto.colunas),
    cartoes: fundirMapa(local.cartoes, remoto.cartoes)
  };
}
function limparTumulos(doc){
  const corte = agora() - TOMBO;
  ["pastas","colunas","cartoes"].forEach(m => {
    Object.keys(doc[m]).forEach(k => { if(doc[m][k].del && (doc[m][k].mod||0) < corte) delete doc[m][k]; });
  });
  return doc;
}

/* =================== armazenamento local =================== */

/* Dentro do Claude existe window.storage. Hospedado num endereço próprio,
   não existe — aí o app usa o armazenamento do próprio navegador. */
let _armazem;
function armazem(){
  if(_armazem !== undefined) return _armazem;
  if(typeof window.storage !== "undefined") return (_armazem = "claude");
  try{
    window.localStorage.setItem("__teste__","1");
    window.localStorage.removeItem("__teste__");
    return (_armazem = "navegador");
  }catch(e){ semArmazenamento = true; return (_armazem = null); }
}
async function lerLocal(chave){
  const a = armazem();
  try{
    if(a === "claude"){
      const r = await window.storage.get(chave, false);
      return r && r.value ? JSON.parse(r.value) : null;
    }
    if(a === "navegador"){
      const v = window.localStorage.getItem(chave);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ return null; }
  return null;
}
async function gravarLocal(chave, valor){
  const a = armazem();
  try{
    if(a === "claude"){ await window.storage.set(chave, JSON.stringify(valor), false); return; }
    if(a === "navegador"){ window.localStorage.setItem(chave, JSON.stringify(valor)); return; }
    semArmazenamento = true;
  }catch(e){ semArmazenamento = true; }
}
function salvarLocal(){
  clearTimeout(salvamento);
  salvamento = setTimeout(() => gravarLocal(CHAVE_DOC, estado), 300);
}
/** toda alteração passa por aqui: grava no aparelho e agenda o envio */
function mudou(){ if(estado) estado.virgem = false; salvarLocal(); Sinc.agendar(); }

/* =================== sincronização =================== */

function cabecalhos(chave){
  // chave nova (sb_publishable_...) vai só no apikey;
  // a antiga (JWT, começa com eyJ) aceita também o Authorization
  const c = { "Content-Type":"application/json", "apikey":chave };
  if(/^eyJ/.test(chave)) c["Authorization"] = "Bearer " + chave;
  return c;
}
function detalhe(txt){
  if(!txt) return "";
  try{ const j = JSON.parse(txt); return j.message || j.hint || j.error_description || j.error || ""; }
  catch(e){ return String(txt).slice(0,140); }
}

const Sinc = {
  ligado:false, versao:null, status:"local", ultimoOk:null,
  timer:null, envio:null, retentar:null, ocupado:false, sujo:false, erro:"",

  url(fn){ return cfg.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn; },

  async rpc(fn, corpo){
    // chave nova (sb_publishable_...) vai só no cabeçalho apikey;
    // a chave antiga (JWT, começa com eyJ) aceita também o Authorization
    const r = await fetch(this.url(fn), { method:"POST", headers:cabecalhos(cfg.chave), body:JSON.stringify(corpo) });
    const t = await r.text();
    if(!r.ok){
      const e = new Error("HTTP " + r.status + (detalhe(t) ? " — " + detalhe(t) : ""));
      e.status = r.status;
      throw e;
    }
    return t ? JSON.parse(t) : null;
  },

  marcar(s, erro){
    this.status = s; this.erro = erro || "";
    if(s === "ok") this.ultimoOk = agora();
    pintarStatus();
  },

  async conectar(silencioso){
    if(!cfg.url || !cfg.chave || !cfg.senha){ this.desligar(); return false; }
    this.marcar("enviando");
    try{
      await this.rpc("criar_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
      const linhas = await this.rpc("ler_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
      if(!linhas || !linhas.length){
        this.marcar("erro","senha");
        if(!silencioso) brinde("Senha do quadro não confere com a do servidor.");
        return false;
      }
      const linha = linhas[0];
      this.versao = linha.versao;
      const remoto = linha.dados && linha.dados.pastas ? linha.dados : null;
      if(remoto){
        // quadro ainda intocado neste aparelho: adota o da equipe inteiro,
        // para não empurrar os cartões de exemplo para dentro do quadro alheio
        estado = limparTumulos(estado.virgem ? remoto : fundir(estado, remoto));
        estado.virgem = false;
        salvarLocal(); ajustarVista(); desenhar();
      }
      this.ligado = true;
      this.marcar("ok");
      await this.enviar();          // sobe o que houver de local
      this.iniciarRelogio();
      return true;
    }catch(e){
      this.marcar("erro", String(e.message||e));
      if(!silencioso) brinde(String(e.message||e).indexOf("HTTP") === 0
        ? "Servidor recusou: " + e.message
        : "A chamada não saiu do navegador. Toque em “Testar conexão”.");
      clearTimeout(this.retentar);
      this.retentar = setTimeout(() => {
        if(cfg.url && cfg.chave && cfg.senha && !this.ligado) this.conectar(true);
      }, 15000);
      return false;
    }
  },

  desligar(){
    this.ligado = false; this.versao = null; this.sujo = false;
    clearInterval(this.timer); this.timer = null;
    clearTimeout(this.retentar); this.retentar = null;
    this.marcar("local");
  },

  iniciarRelogio(){
    clearInterval(this.timer);
    this.timer = setInterval(async () => {
      if(!this.ligado || document.hidden || arrasto) return;
      await this.puxar();
      if(this.sujo) await this.enviar();   // reenvia o que ficou preso offline
    }, INTERVALO);
  },

  /** checa a versão no servidor (barato) e só baixa o documento se mudou */
  async puxar(){
    if(!this.ligado || this.ocupado) return;
    this.ocupado = true;
    try{
      const v = await this.rpc("versao_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
      if(v === null || v === undefined){ this.marcar("erro","senha"); this.ocupado = false; return; }
      if(v === this.versao){ this.marcar("ok"); this.ocupado = false; return; }
      const linhas = await this.rpc("ler_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
      if(linhas && linhas.length){
        const linha = linhas[0];
        this.versao = linha.versao;
        if(linha.dados && linha.dados.pastas){
          estado = limparTumulos(fundir(estado, linha.dados));
          salvarLocal(); ajustarVista();
          if(!arrasto && !folha.classList.contains("on")) desenhar(); else desenharAbas();
          if(linha.atualizado_por && linha.atualizado_por !== cfg.eu) brinde("Quadro atualizado por " + linha.atualizado_por + ".");
        }
      }
      this.marcar("ok");
    }catch(e){ this.marcar("erro", String(e.message||e)); }
    this.ocupado = false;
  },

  agendar(){
    if(!this.ligado){ return; }
    this.sujo = true;
    clearTimeout(this.envio);
    this.envio = setTimeout(() => this.enviar(), 900);
    this.marcar("enviando");
  },

  async enviar(tentativa){
    if(!this.ligado || this.ocupado) return;
    tentativa = tentativa || 0;
    this.ocupado = true;
    try{
      const nova = await this.rpc("gravar_quadro", {
        p_id:cfg.quadro, p_senha:cfg.senha, p_dados:Object.assign({}, estado, { virgem:undefined }),
        p_versao:this.versao, p_por:cfg.eu || "alguém"
      });
      if(nova === null || nova === undefined){
        // outra pessoa gravou antes: baixa, mescla e tenta de novo
        this.ocupado = false;
        if(tentativa >= 3){ this.marcar("erro","conflito"); return; }
        await this.puxar();
        return this.enviar(tentativa + 1);
      }
      this.versao = nova; this.sujo = false;
      this.marcar("ok");
    }catch(e){ this.marcar("erro", String(e.message||e)); }
    this.ocupado = false;
  }
};

function pintarStatus(){
  const ponto = document.getElementById("ponto");
  const txt = document.getElementById("txtStatus");
  ponto.className = "ponto";
  if(!Sinc.ligado){
    txt.textContent = semArmazenamento ? "Sem salvamento automático" : "Só neste aparelho";
    if(Sinc.status === "erro") ponto.classList.add("erro");
    return;
  }
  if(Sinc.status === "enviando"){ ponto.classList.add("enviando"); txt.textContent = "Enviando…"; return; }
  if(Sinc.status === "erro"){
    ponto.classList.add("erro");
    txt.textContent = Sinc.erro === "senha" ? "Senha recusada" : "Sem conexão · guardado aqui";
    return;
  }
  ponto.classList.add("on");
  const d = new Date(Sinc.ultimoOk || agora());
  txt.textContent = "Sincronizado · " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function desenharQuadro(){
  ajustarVista();
  if(!vista.pasta){ document.getElementById("tela").innerHTML = '<div class="rolo"><div class="nada">Nenhuma pasta.<br>Toque em “+ Pasta” para criar a primeira.</div></div>'; return; }
  let h = '<div class="trilho" id="trilho">';

    h += '<section class="coluna" data-coluna="'+k.id+'">';

function ondeEsta(c){
  const k = estado.colunas[c.coluna];
  const p = k ? estado.pastas[k.pasta] : null;
  return (p ? p.nome : "?") + " · " + (k ? k.nome : "?");
}

function desenharPrazos(){
  const itens = vivas(estado.cartoes).filter(c => c.prazo && estado.colunas[c.coluna] && !estado.colunas[c.coluna].del)
                  .map(c => ({ c, d:diasAte(c.prazo) })).sort((a,b) => a.d - b.d);
  const grupos = [
    { t:"Vencidos", f:i => i.d < 0, u:true },
    { t:"Hoje", f:i => i.d === 0, u:true },
    { t:"Próximos 7 dias", f:i => i.d > 0 && i.d <= 7 },
    { t:"Depois", f:i => i.d > 7 }
  ];
  let h = '<div class="rolo">';
  if(!itens.length) h += '<div class="nada">Nenhuma tarefa com prazo.<br>Abra uma tarefa e defina a data para ela aparecer aqui.</div>';
  grupos.forEach(g => {
    const lista = itens.filter(g.f);
    if(!lista.length) return;
    h += '<div class="grupo'+(g.u?" urgente":"")+'"><h3>'+g.t+'</h3>';
    lista.forEach(i => {
      const r = rotuloPrazo(i.c.prazo);
      h += '<button class="linha-item" data-cartao="'+i.c.id+'"><span class="prazo '+r.cls+'">'+r.txt+'</span>'
         + '<span style="flex:1;min-width:0"><span class="tit">'+esc(i.c.titulo)+'</span><br>'
         + '<span class="onde">'+esc(ondeEsta(i.c))+'</span></span></button>';
    });
    h += '</div>';
  });
  document.getElementById("tela").innerHTML = h + '</div>';
}

function desenharBusca(){
  const q = vista.busca.trim().toLowerCase();
  let h = '<div class="rolo">';
  if(!q){
    h += '<div class="nada">Digite para buscar por título, etiqueta ou anotação.</div>';
  }else{
    const achados = vivas(estado.cartoes).filter(c => (c.titulo+" "+c.etiqueta+" "+c.notas).toLowerCase().indexOf(q) > -1);
    if(!achados.length){
      h += '<div class="nada">Nada encontrado para “'+esc(vista.busca)+'”.</div>';
    }else{
      h += '<div class="grupo"><h3>'+achados.length+' resultado'+(achados.length>1?"s":"")+'</h3>';
      achados.forEach(c => {
        h += '<button class="linha-item" data-cartao="'+c.id+'"><span style="flex:1;min-width:0">'
           + '<span class="tit">'+esc(c.titulo)+'</span><br><span class="onde">'+esc(ondeEsta(c))+'</span></span></button>';
      });
      h += '</div>';
    }
  }
  document.getElementById("tela").innerHTML = h + '</div>';
}

function desenhar(){
  document.getElementById("tituloApp").textContent = estado.titulo || "Central do Gabinete";
  desenharAbas();
  if(vista.modo === "busca") desenharBusca();
  else if(vista.modo === "prazos") desenharPrazos();

  });

    c.del = true; tocar(c);

    const titulo = document.getElementById("fTitulo").value.trim();

    desenhar();

/* =================== diagnóstico =================== */

async function diagnosticar(){
  const alvo = document.getElementById("sDiag");
  if(!alvo) return;
  const url = document.getElementById("sUrl").value.trim().replace(/\/+$/,"");
  const chave = document.getElementById("sChave").value.trim();
  const quadro = document.getElementById("sQuadro").value.trim() || "gabinete";
  const senha = document.getElementById("sSenha").value;
  const linhas = [];
  const pinta = () => { alvo.innerHTML = linhas.join(""); };
  const diga = (ok, txt) => { linhas.push('<div class="diag '+(ok?"ok":"ruim")+'">'+(ok?"✓":"✕")+" "+esc(txt)+"</div>"); pinta(); };
  const nota = txt => { linhas.push('<div class="aviso">'+txt+"</div>"); pinta(); };

  linhas.push('<div class="diag">Testando…</div>'); pinta();
  linhas.length = 0;

  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url))
    diga(false, "Endereço fora do padrão. Precisa ser https://xxxx.supabase.co, sem barra no fim.");
  else diga(true, "Endereço no formato certo.");

  if(!chave){ diga(false, "Falta a chave publicável."); return; }
  if(/^sb_secret_/.test(chave) || /service_role/.test(chave)){
    diga(false, "Essa é uma chave secreta. Nunca use aqui — troque pela publicável.");
    return;
  }

  try{
    const r = await fetch(url + "/rest/v1/", { headers:{ apikey:chave } });
    if(r.status === 401) { diga(false, "O servidor respondeu 401: chave recusada."); return; }
    diga(true, "Servidor respondeu (HTTP " + r.status + ").");
  }catch(e){
    diga(false, "A chamada nem saiu do navegador.");
    nota("Isso quase sempre é o sandbox: rodando dentro do Claude, chamadas para fora podem ser barradas. Baixe este arquivo e abra direto no computador, ou hospede num endereço próprio — aí a sincronização funciona.");
    return;
  }

  try{
    const r = await fetch(url + "/rest/v1/rpc/criar_quadro", { method:"POST", headers:cabecalhos(chave), body:JSON.stringify({ p_id:quadro, p_senha:senha }) });
    const t = await r.text();
    if(r.status === 404){ diga(false, "A função criar_quadro não existe. Rode o supabase-setup.sql no SQL Editor."); return; }
    if(!r.ok){ diga(false, "criar_quadro: HTTP " + r.status + " — " + detalhe(t)); return; }
    diga(true, "Funções instaladas no banco.");
  }catch(e){ diga(false, "Falha em criar_quadro: " + e.message); return; }

  try{
    const r = await fetch(url + "/rest/v1/rpc/versao_quadro", { method:"POST", headers:cabecalhos(chave), body:JSON.stringify({ p_id:quadro, p_senha:senha }) });
    const t = (await r.text()).trim();
    if(!r.ok){ diga(false, "versao_quadro: HTTP " + r.status + " — " + detalhe(t)); return; }
    if(!t || t === "null") diga(false, "Senha do quadro não confere com a que está gravada no servidor.");
    else diga(true, "Senha aceita. Quadro “" + quadro + "” na versão " + t + ". Pode conectar.");
  }catch(e){ diga(false, "Falha em versao_quadro: " + e.message); }
}

/* =================== ações =================== */

function criarPasta(){
  pedirTexto("Nome da nova pasta", "", v => {
    const ordem = (pastas().slice(-1)[0] || { ordem:-1 }).ordem + 1;
    const p = tocar({ id:id("p"), nome:v, ordem });
    estado.pastas[p.id] = p;
    ["Entrada","Em andamento","Concluído"].forEach((nome,i) => {
      const k = tocar({ id:id("k"), pasta:p.id, nome, ordem:i });
      estado.colunas[k.id] = k;
    });
    vista.pasta = p.id; vista.modo = "quadro";
    mudou(); desenhar();
  });
}

document.addEventListener("click", e => {
  if(e.target.closest("[data-fechar]")){ fecharFolha(); return; }

  const item = e.target.closest("[data-acao]");
  if(item){
    const a = item.dataset.acao;
    const p = vista.pasta ? estado.pastas[vista.pasta] : null;
    if(a === "sinc") folhaSinc();
    if(a === "renomear-pasta" && p) pedirTexto("Nome da pasta", p.nome, v => { p.nome = v; tocar(p); mudou(); desenhar(); });
    if(a === "nova-coluna" && p) pedirTexto("Nome da coluna", "", v => {
      const ordem = (colunas(p.id).slice(-1)[0] || { ordem:-1 }).ordem + 1;
      const k = tocar({ id:id("k"), pasta:p.id, nome:v, ordem });
      estado.colunas[k.id] = k; mudou(); desenhar();
    });
    if(a === "renomear-coluna") folhaColunas();
    if(a === "nova-pasta") criarPasta();
    if(a === "excluir-pasta" && p){
      const n = colunas(p.id).reduce((s,k) => s + cartoes(k.id).length, 0);
      abrirFolha('<h2>Excluir pasta</h2><p>Isso apaga <strong>'+esc(p.nome)+'</strong> e '+n+' tarefa'+(n===1?"":"s")+' para todo mundo do quadro.</p>'
        + '<div class="acoes"><button class="btn claro" data-fechar="1">Cancelar</button>'
        + '<button class="btn" id="confDel" style="background:var(--alerta)">Excluir</button></div>');
      document.getElementById("confDel").addEventListener("click", () => {
        colunas(p.id).forEach(k => { cartoes(k.id).forEach(c => { c.del = true; tocar(c); }); k.del = true; tocar(k); });
        p.del = true; tocar(p);
        vista.pasta = null; fecharFolha(); mudou(); desenhar(); brinde("Pasta excluída.");
      });
    }
    if(a === "titulo") pedirTexto("Título do app", estado.titulo, v => {
      estado.titulo = v; estado.tituloMod = agora(); mudou(); desenhar();
    });
    if(a === "exportar"){
      const blob = new Blob([JSON.stringify(estado, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement("a");
      a2.href = url; a2.download = "central-gabinete-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      fecharFolha(); brinde("Backup exportado.");
    }
    if(a === "importar") document.getElementById("arquivo").click();
    return;
  }

  const del = e.target.closest("[data-del]");
  if(del){
    e.stopPropagation();
    const k = estado.colunas[del.dataset.del];
    if(colunas(vista.pasta).length < 2){ brinde("Mantenha ao menos uma coluna."); return; }
    cartoes(k.id).forEach(c => { c.del = true; tocar(c); });
    k.del = true; tocar(k);
    mudou(); desenhar(); folhaColunas();
    return;
  }
  const col = e.target.closest("[data-col]");
  if(col){
    const k = estado.colunas[col.dataset.col];
    pedirTexto("Nome da coluna", k.nome, v => { k.nome = v; tocar(k); mudou(); desenhar(); });
    return;
  }

  const aba = e.target.closest(".aba");
  if(aba){
    if(aba.dataset.nova){ criarPasta(); return; }
    document.getElementById("barraBusca").classList.remove("on");
    vista.busca = "";
    if(aba.dataset.prazos) vista.modo = "prazos";
    else { vista.pasta = aba.dataset.pasta; vista.modo = "quadro"; }
    desenhar();
    return;
  }

  const add = e.target.closest("[data-addcol]");
  if(add){ folhaCartao(null, add.dataset.addcol); return; }

  const linha = e.target.closest(".linha-item");
  if(linha){ folhaCartao(linha.dataset.cartao); return; }

  const cartao = e.target.closest(".cartao");
  if(cartao && !arrastou){ folhaCartao(cartao.dataset.cartao); return; }
});

document.getElementById("arquivo").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const novo = migrar(JSON.parse(leitor.result));
      if(!novo) throw new Error("formato");
      estado = limparTumulos(fundir(estado, novo));
      ajustarVista(); fecharFolha(); mudou(); desenhar(); brinde("Backup mesclado ao quadro.");
    }catch(err){ brinde("Arquivo inválido. Use um backup exportado aqui."); }
  };
  leitor.readAsText(f);
  e.target.value = "";
});

document.getElementById("fab").addEventListener("click", () => folhaCartao(null, null));
document.getElementById("btMenu").addEventListener("click", folhaMenu);
document.getElementById("marca").addEventListener("click", folhaSinc);

document.getElementById("btBusca").addEventListener("click", () => {
  document.getElementById("barraBusca").classList.add("on");
  vista.modo = "busca"; vista.busca = "";
  desenhar();
  document.getElementById("campoBusca").focus();
});
document.getElementById("btFecharBusca").addEventListener("click", () => {
  document.getElementById("barraBusca").classList.remove("on");
  vista.modo = "quadro"; vista.busca = "";
  desenhar();
});
document.getElementById("campoBusca").addEventListener("input", e => {
  vista.busca = e.target.value; desenharBusca();
});

document.addEventListener("visibilitychange", async () => {
  if(document.hidden || !Sinc.ligado) return;
  await Sinc.puxar();
  if(Sinc.sujo) await Sinc.enviar();
});

/* =================== arrastar e soltar =================== */

let arrasto = null, arrastou = false, temporizador = null, inicio = null;
let velX = 0, velY = 0, listaVel = null, quadroAF = null;

document.addEventListener("pointerdown", e => {
  if(e.button !== undefined && e.button !== 0) return;
  const cartao = e.target.closest(".cartao");
  if(!cartao) return;
  arrastou = false;
  inicio = { x:e.clientX, y:e.clientY };
  if(e.target.closest(".pega")){ e.preventDefault(); comecar(e, cartao); return; }
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { temporizador = null; comecar(e, cartao); }, 250);
}, { passive:false });

function comecar(e, cartao){
  const r = cartao.getBoundingClientRect();
  const fantasma = cartao.cloneNode(true);
  fantasma.classList.add("fantasma");
  fantasma.style.width = r.width + "px";
  fantasma.style.left = r.left + "px";
  fantasma.style.top = r.top + "px";
  document.body.appendChild(fantasma);

  const lugar = document.createElement("div");
  lugar.className = "vazio-lugar";
  lugar.style.height = r.height + "px";
  cartao.parentNode.insertBefore(lugar, cartao.nextSibling);
  cartao.classList.add("origem");

  arrasto = { cartao, fantasma, lugar, dx:e.clientX - r.left, dy:e.clientY - r.top };
  arrastou = true;
  document.body.style.userSelect = "none";
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
  laco();
}

document.addEventListener("pointermove", e => {
  if(temporizador && inicio){
    if(Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 9){ clearTimeout(temporizador); temporizador = null; }
    return;
  }
  if(!arrasto) return;
  e.preventDefault();
  arrasto.fantasma.style.left = (e.clientX - arrasto.dx) + "px";
  arrasto.fantasma.style.top = (e.clientY - arrasto.dy) + "px";

  const sob = document.elementFromPoint(e.clientX, e.clientY);
  const lista = sob && sob.closest ? sob.closest(".lista") : null;
  document.querySelectorAll(".lista.alvo").forEach(l => l.classList.remove("alvo"));
  if(lista){
    lista.classList.add("alvo");
    const vazio = lista.querySelector(".nada");
    if(vazio) vazio.remove();
    const irmaos = [...lista.querySelectorAll(".cartao:not(.origem)")];
    let antes = null;
    for(const s of irmaos){
      const rr = s.getBoundingClientRect();
      if(e.clientY < rr.top + rr.height / 2){ antes = s; break; }
    }
    if(antes) lista.insertBefore(arrasto.lugar, antes); else lista.appendChild(arrasto.lugar);
  }
  medirRolagem(e.clientX, e.clientY);
}, { passive:false });

document.addEventListener("touchmove", e => { if(arrasto) e.preventDefault(); }, { passive:false });

function medirRolagem(x, y){
  const trilho = document.getElementById("trilho");
  velX = 0; velY = 0; listaVel = null;
  if(trilho){
    const r = trilho.getBoundingClientRect();
    if(x > r.right - 72) velX = 13; else if(x < r.left + 72) velX = -13;
  }
  const sob = document.elementFromPoint(x, y);
  const lista = sob && sob.closest ? sob.closest(".lista") : null;
  if(lista){
    const r = lista.getBoundingClientRect();
    if(y > r.bottom - 54){ velY = 9; listaVel = lista; }
    else if(y < r.top + 54){ velY = -9; listaVel = lista; }
  }
}
function laco(){
  if(!arrasto){ quadroAF = null; return; }
  const trilho = document.getElementById("trilho");
  if(velX && trilho) trilho.scrollLeft += velX;
  if(velY && listaVel) listaVel.scrollTop += velY;
  quadroAF = requestAnimationFrame(laco);
}

function soltar(){
  clearTimeout(temporizador); temporizador = null;
  if(!arrasto) return;
  const { cartao, fantasma, lugar } = arrasto;
  const destinoLista = lugar.parentNode;
  const c = estado.cartoes[cartao.dataset.cartao];
  const kid = destinoLista ? destinoLista.dataset.lista : null;

  if(c && kid && estado.colunas[kid]){
    const irmaos = [...destinoLista.children].filter(el => (el.classList.contains("cartao") && el !== cartao) || el === lugar);
    const i = irmaos.indexOf(lugar);
    const antes  = i > 0 ? irmaos[i-1].dataset.cartao : null;
    const depois = i < irmaos.length - 1 ? irmaos[i+1].dataset.cartao : null;
    c.coluna = kid;
    let o = ordemEntre(antes, depois);
    if(o === null){ renumerar(kid); o = ordemEntre(antes, depois); }
    c.ordem = (o === null ? 0 : o);
    tocar(c);
    mudou();
  }
  fantasma.remove(); lugar.remove();
  cartao.classList.remove("origem");
  document.querySelectorAll(".lista.alvo").forEach(l => l.classList.remove("alvo"));
  document.body.style.userSelect = "";
  arrasto = null; velX = velY = 0;
  if(quadroAF){ cancelAnimationFrame(quadroAF); quadroAF = null; }
  desenhar();
  setTimeout(() => { arrastou = false; }, 60);
}
document.addEventListener("pointerup", soltar);
document.addEventListener("pointercancel", soltar);

document.addEventListener("keydown", e => {
  const el = document.activeElement;
  if(!el || !el.classList || !el.classList.contains("cartao")) return;
  if(e.key === "Enter"){ folhaCartao(el.dataset.cartao); return; }
  if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  const c = estado.cartoes[el.dataset.cartao];
  const ks = colunas(vista.pasta);
  const atual = ks.findIndex(k => k.id === c.coluna);
  const alvo = ks[atual + (e.key === "ArrowRight" ? 1 : -1)];
  if(!alvo) return;
  const primeiro = cartoes(alvo.id)[0];
  c.coluna = alvo.id;
  c.ordem = primeiro ? primeiro.ordem - 1 : 0;
  tocar(c); mudou(); desenhar();
  const novo = document.querySelector('[data-cartao="'+c.id+'"]');
  if(novo){ novo.focus(); novo.scrollIntoView({ block:"nearest", inline:"center" }); }
  brinde("Movido para " + alvo.nome + ".");
});

/* =================== início =================== */

(async function iniciar(){
  const salvo = await lerLocal(CHAVE_DOC);
  estado = migrar(salvo) || semente();
  estado = limparTumulos(estado);

  const c = await lerLocal(CHAVE_CFG);
  if(c) cfg = Object.assign(cfg, c);

  ajustarVista();
  desenhar();

  if(cfg.url && cfg.chave){
    if(cfg.senha){ Sinc.conectar(true); }
    else { brinde("Digite a senha do quadro para sincronizar."); folhaSinc(); }
  }
  if(semArmazenamento) brinde("Sessão sem salvamento automático. Exporte backups.");
})();

})();
