/* =================== arrastar e soltar =================== */

let arrasto = null, arrastou = false, temporizador = null, inicio = null;
let velX = 0, velY = 0, listaVel = null, quadroAF = null;

document.addEventListener("pointerdown", e => {
  ultimaAcao = Date.now();
  if(e.button !== undefined && e.button !== 0) return;
  const cartao = e.target.closest(".cartao");
  if(!cartao) return;
  arrastou = false;
  inicio = { x:e.clientX, y:e.clientY };
  if(e.target.closest(".pega")){ e.preventDefault(); comecar(e, cartao); return; }
  clearTimeout(temporizador);
  const guardado = { clientX:e.clientX, clientY:e.clientY };
  temporizador = setTimeout(() => { temporizador = null; comecar(guardado, cartao); }, 220);
}, { passive:false });

// segurar o dedo sobre um cartão não abre menu de seleção do sistema
document.addEventListener("contextmenu", e => {
  if(e.target.closest && e.target.closest(".cartao")) e.preventDefault();
});
document.addEventListener("selectstart", e => {
  if(arrasto || (temporizador && e.target.closest && e.target.closest(".cartao"))) e.preventDefault();
});

function comecar(e, cartao){
  // o navegador tende a selecionar o texto do cartão ao segurar; isso desfaz
  try{
    const sel = window.getSelection();
    if(sel && sel.removeAllRanges) sel.removeAllRanges();
  }catch(err){}
  const r = cartao.getBoundingClientRect();
  const fantasma = cartao.cloneNode(true);
  fantasma.classList.add("fantasma");
  fantasma.style.width = r.width + "px";
  fantasma.style.left = r.left + "px";
  fantasma.style.top = r.top + "px";
  document.body.appendChild(fantasma);

  const lugar = document.createElement("div");
  lugar.className = "vazio-lugar";
  lugar.style.height = r.height + "px";
  cartao.parentNode.insertBefore(lugar, cartao.nextSibling);
  cartao.classList.add("origem");

  arrasto = { cartao, fantasma, lugar, dx:e.clientX - r.left, dy:e.clientY - r.top };
  arrastou = true;
  document.body.style.userSelect = "none";
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
  laco();
}

document.addEventListener("pointermove", e => {
  if(temporizador && inicio){
    if(Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 9){ clearTimeout(temporizador); temporizador = null; }
    return;
  }
  if(!arrasto) return;
  e.preventDefault();
  arrasto.fantasma.style.left = (e.clientX - arrasto.dx) + "px";
  arrasto.fantasma.style.top = (e.clientY - arrasto.dy) + "px";

  const sob = document.elementFromPoint(e.clientX, e.clientY);
  const lista = sob && sob.closest ? sob.closest(".lista") : null;
  document.querySelectorAll(".lista.alvo").forEach(l => l.classList.remove("alvo"));
  if(lista){
    lista.classList.add("alvo");
    const vazio = lista.querySelector(".nada");
    if(vazio) vazio.remove();
    const irmaos = [...lista.querySelectorAll(".cartao:not(.origem)")];
    let antes = null;
    for(const s of irmaos){
      const rr = s.getBoundingClientRect();
      if(e.clientY < rr.top + rr.height / 2){ antes = s; break; }
    }
    if(antes) lista.insertBefore(arrasto.lugar, antes); else lista.appendChild(arrasto.lugar);
  }
  medirRolagem(e.clientX, e.clientY);
}, { passive:false });

document.addEventListener("touchmove", e => { if(arrasto) e.preventDefault(); }, { passive:false });

function medirRolagem(x, y){
  const trilho = document.getElementById("trilho");
  velX = 0; velY = 0; listaVel = null;
  if(trilho){
    const r = trilho.getBoundingClientRect();
    if(x > r.right - 72) velX = 13; else if(x < r.left + 72) velX = -13;
  }
  const sob = document.elementFromPoint(x, y);
  const lista = sob && sob.closest ? sob.closest(".lista") : null;
  if(lista){
    const r = lista.getBoundingClientRect();
    if(y > r.bottom - 54){ velY = 9; listaVel = lista; }
    else if(y < r.top + 54){ velY = -9; listaVel = lista; }
  }
}
function laco(){
  if(!arrasto){ quadroAF = null; return; }
  const trilho = document.getElementById("trilho");
  if(velX && trilho) trilho.scrollLeft += velX;
  if(velY && listaVel) listaVel.scrollTop += velY;
  quadroAF = requestAnimationFrame(laco);
}

function soltar(){
  clearTimeout(temporizador); temporizador = null;
  if(!arrasto) return;
  const { cartao, fantasma, lugar } = arrasto;
  const destinoLista = lugar.parentNode;
  const c = estado.cartoes[cartao.dataset.cartao];
  const kid = destinoLista ? destinoLista.dataset.lista : null;

  if(c && kid && estado.colunas[kid]){
    const irmaos = [...destinoLista.children].filter(el => (el.classList.contains("cartao") && el !== cartao) || el === lugar);
    const i = irmaos.indexOf(lugar);
    const antes  = i > 0 ? irmaos[i-1].dataset.cartao : null;
    const depois = i < irmaos.length - 1 ? irmaos[i+1].dataset.cartao : null;
    const colunaAntes = c.coluna;
    c.coluna = kid;
    let o = ordemEntre(antes, depois);
    if(o === null){ renumerar(kid); o = ordemEntre(antes, depois); }
    c.ordem = (o === null ? 0 : o);
    if(colunaAntes !== kid){
      const eraFinal = (estado.colunas[colunaAntes] || {}).final;
      ajustarFeito(c, colunaAntes);
      registrar(c, (c.feito && !eraFinal) ? "f" : "m", estado.colunas[kid].nome);
    }
    tocar(c);
    mudou();
  }
  fantasma.remove(); lugar.remove();
  cartao.classList.remove("origem");
  document.querySelectorAll(".lista.alvo").forEach(l => l.classList.remove("alvo"));
  document.body.style.userSelect = "";
  arrasto = null; velX = velY = 0;
  if(quadroAF){ cancelAnimationFrame(quadroAF); quadroAF = null; }
  desenhar();
  setTimeout(() => { arrastou = false; }, 60);
}
document.addEventListener("pointerup", soltar);
document.addEventListener("pointercancel", soltar);

document.addEventListener("keydown", e => {
  const el = document.activeElement;
  if(!el || !el.classList || !el.classList.contains("cartao")) return;
  if(e.key === "Enter"){ folhaCartao(el.dataset.cartao); return; }
  if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  const c = estado.cartoes[el.dataset.cartao];
  const ks = colunas(vista.pasta);
  const atual = ks.findIndex(k => k.id === c.coluna);
  const alvo = ks[atual + (e.key === "ArrowRight" ? 1 : -1)];
  if(!alvo) return;
  const primeiro = cartoes(alvo.id)[0];
  const colunaAntes = c.coluna;
  c.coluna = alvo.id;
  c.ordem = primeiro ? primeiro.ordem - 1 : 0;
  ajustarFeito(c, colunaAntes);
  registrar(c, "m", alvo.nome);
  tocar(c); mudou(); desenhar();
  const novo = document.querySelector('[data-cartao="'+c.id+'"]');
  if(novo){ novo.focus(); novo.scrollIntoView({ block:"nearest", inline:"center" }); }
  brinde("Movido para " + alvo.nome + ".");
});

(async function iniciar(){
  const salvo = await lerLocal(CHAVE_DOC);
  estado = migrar(salvo) || semente();
  estado = limparTumulos(completar(estado));

  const c = await lerLocal(CHAVE_CFG);
  if(c) cfg = Object.assign(cfg, c);
  const ses = await lerLocal(CHAVE_SES);
  if(ses && ses.refresh) sessao = ses;

  ajustarVista();
  desenhar();

  const doLink = lerTokenDoLink();
  if(doLink && cfg.url && cfg.chave){
    sessao = doLink;
    cfg.modo = "login";
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    await Auth.quemSou();
    await gravarLocal(CHAVE_SES, sessao);
    await gravarLocal(CHAVE_CFG, Object.assign({}, cfg, { senha:"" }));
    desenhar();
    const entrou = await Sinc.conectar(false);
    desenhar();
    brinde(entrou ? ("Você entrou como " + (cfg.eu || sessao.email) + ".") : "Entrou, mas o e-mail não está autorizado.");
    return;
  }

  const convite = lerConvite();
  if(convite && convite.u && convite.k && !cfg.url){
    cfg.url = convite.u; cfg.chave = convite.k; cfg.quadro = convite.q || "gabinete";
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    folhaSinc();
    brinde("Convite recebido. Falta seu nome e a senha do quadro.");
  }else if(cfg.url && cfg.chave){
    if(cfg.modo === "login"){
      if(sessao) conexaoInicial = Sinc.conectar(true);
      else folhaLogin("email", "");
    }
    else if(cfg.senha){ conexaoInicial = Sinc.conectar(true); }
    else { brinde("Digite a senha do quadro para sincronizar."); folhaSinc(); }
  }
  if(semArmazenamento) brinde("Sessão sem salvamento automático. Exporte backups.");

})();


})();
