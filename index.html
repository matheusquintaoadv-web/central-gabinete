<style>
  :root{
    --tinta:#0E1B36; --tinta-2:#1B2C52; --tinta-3:#31456F;
    --papel:#E7ECF3; --carta:#FFFFFF;
    --ouro:#C8A63C; --ouro-2:color-mix(in srgb, var(--ouro) 38%, #fff);
    --texto:#0E1B36; --texto-2:#5D6A88; --linha:#D4DBE6;
    --alerta:#B3261E; --ambar:#A8710F; --ok:#1B6B48;
    --topo:56px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--papel);color:var(--texto);
    font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior:none;
  }
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:6px}

  .topo{
    position:fixed;top:0;left:0;right:0;z-index:40;
    padding:var(--safe-t) 14px 0;height:calc(var(--topo) + var(--safe-t));
    background:var(--tinta);display:flex;align-items:center;gap:10px;
    box-shadow:0 1px 0 rgba(255,255,255,.08),0 6px 20px rgba(14,27,54,.18);
  }
  .selo{
    width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;color:var(--ouro);
  }
  .selo svg{display:block}
  .marca{flex:1;min-width:0;text-align:left}
  .marca h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .marca p{
    margin:0;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    color:rgba(255,255,255,.5);font-weight:500;display:flex;align-items:center;gap:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ponto{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#6B7A99}
  .ponto.on{background:#4CAF7D}
  .ponto.enviando{background:var(--ouro);animation:pulsa 1s infinite}
  .ponto.erro{background:#E4796F}
  @keyframes pulsa{50%{opacity:.25}}
  .icone{width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
  .icone:active{background:rgba(255,255,255,.12)}
  .icone svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .busca{
    position:fixed;top:var(--safe-t);left:0;right:0;z-index:41;height:var(--topo);
    background:var(--tinta);display:none;align-items:center;gap:8px;padding:0 10px;
  }
  .busca.on{display:flex}
  .busca input{
    flex:1;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);color:#fff;padding:0 12px;
  }
  .busca input::placeholder{color:rgba(255,255,255,.45)}

  .pastas{
    position:fixed;z-index:39;left:0;right:0;top:calc(var(--topo) + var(--safe-t));
    background:var(--tinta-2);height:42px;display:flex;gap:2px;
    overflow-x:auto;overflow-y:hidden;padding:0 8px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.32) transparent;
  }
  .pastas::-webkit-scrollbar{height:6px}
  .pastas::-webkit-scrollbar-track{background:transparent}
  .pastas::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:3px}
  .pastas::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45)}

  /* setas para percorrer as abas quando não cabem todas */
  .seta-abas{
    position:fixed;z-index:42;top:calc(var(--topo) + var(--safe-t));
    width:30px;height:42px;display:none;place-items:center;
    color:#fff;font-size:20px;line-height:1;
  }
  .seta-abas.on{display:grid}
  .seta-abas.esq{left:0;background:linear-gradient(90deg,var(--tinta-2) 55%,transparent)}
  .seta-abas.dir{right:0;background:linear-gradient(270deg,var(--tinta-2) 55%,transparent)}
  .seta-abas:active{color:var(--ouro)}
  .aba{
    flex:0 0 auto;display:flex;align-items:center;padding:0 12px;
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(255,255,255,.55);white-space:nowrap;border-bottom:2px solid transparent;
  }
  .aba[aria-selected="true"]{color:#fff;border-bottom-color:var(--ouro)}
  .aba.prazos{color:var(--ouro-2)}
  .aba.filtro{color:var(--ouro)}
  .aba .n{font-family:var(--mono);font-size:10px;margin-left:5px;opacity:.75}

  main{padding-top:calc(var(--topo) + var(--safe-t) + 42px);height:100dvh}

  .trilho{
    display:flex;gap:12px;height:100%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x proximity;padding:12px 14px calc(14px + var(--safe-b));
    scrollbar-width:thin;scrollbar-color:#AEBACB transparent;
  }
  .trilho::-webkit-scrollbar{height:11px}
  .trilho::-webkit-scrollbar-track{background:transparent}
  .trilho::-webkit-scrollbar-thumb{
    background:#AEBACB;border-radius:6px;border:3px solid transparent;background-clip:content-box;
  }
  .trilho::-webkit-scrollbar-thumb:hover{background:#8D9BB0;background-clip:content-box;border:3px solid transparent}
  @media(min-width:720px){
    .trilho{scroll-snap-type:none}   /* no computador a rolagem é livre */
  }
  .coluna{
    flex:0 0 82vw;max-width:330px;scroll-snap-align:center;
    display:flex;flex-direction:column;min-height:0;
    background:rgba(255,255,255,.5);border:1px solid var(--linha);border-radius:14px;
  }
  @media(min-width:720px){ .coluna{flex-basis:296px} }
  .cab{display:flex;align-items:baseline;gap:8px;padding:12px 13px 9px;border-bottom:1px solid var(--linha)}
  .cab h2{
    margin:0;flex:1;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cab .qtd{font-family:var(--mono);font-size:11px;color:var(--texto-2)}
  .cab .mais{font-size:20px;line-height:1;color:var(--texto-2);padding:0 2px}
  .lista{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:10px;display:flex;flex-direction:column;gap:9px;
    scrollbar-width:thin;scrollbar-color:#C2CCDA transparent;
  }
  .lista::-webkit-scrollbar{width:9px}
  .lista::-webkit-scrollbar-track{background:transparent}
  .lista::-webkit-scrollbar-thumb{
    background:#C2CCDA;border-radius:5px;border:2px solid transparent;background-clip:content-box;
  }
  .lista::-webkit-scrollbar-thumb:hover{background:#9AA8BC;background-clip:content-box;border:2px solid transparent}

  .cartao{
    position:relative;background:var(--carta);border-radius:10px;border:1px solid var(--linha);
    box-shadow:0 1px 2px rgba(14,27,54,.06);padding:11px 12px 10px 15px;
    display:flex;flex-direction:column;gap:7px;touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .cartao *{ -webkit-user-select:none; user-select:none; }
  .cartao::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    border-radius:10px 0 0 10px;background:var(--faixa,var(--linha));
  }
  .cartao.alta::after{
    content:"";position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;
    background:var(--ouro);box-shadow:0 0 0 3px rgba(200,166,60,.18);
  }
  .cartao .tit{font-size:14px;font-weight:500;letter-spacing:-.008em;padding-right:28px}
  .cartao .pe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:24px}
  .protocolo{font-family:var(--mono);font-size:10px;color:#9AA6BE;letter-spacing:.02em}
  .etiqueta{
    font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;
    color:var(--faixa,var(--tinta-3));background:color-mix(in srgb,var(--faixa,#888) 12%,transparent);
  }
  .prazo{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:#EEF1F6;color:var(--texto-2)}
  .prazo.perto{background:#FBF0DA;color:var(--ambar)}
  .prazo.vencido{background:#FBE6E4;color:var(--alerta)}
  .autor{
    font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--tinta-3);
    width:19px;height:19px;border-radius:50%;display:grid;place-items:center;margin-left:auto;
    box-shadow:0 0 0 2px var(--carta);
  }
  .pessoas{display:flex;flex-wrap:wrap;gap:6px}
  .pessoas button{
    display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:20px;
    border:1px solid var(--linha);background:var(--carta);font-size:13px;color:var(--texto-2);
  }

<script>
(function(){
"use strict";

/* ============================================================
   CENTRAL DO GABINETE — v2
   Documento local + sincronização opcional com Supabase.
   A mesclagem é por entidade (pasta / coluna / cartão):
   vence sempre a edição com carimbo de tempo mais recente,
   então duas pessoas podem mexer no quadro ao mesmo tempo.
   ============================================================ */

const VERSAO_APP = 11;                   // sobe a cada versão nova do arquivo
const CHAVE_DOC = "gabinete-doc:v2";
const CHAVE_CFG = "gabinete-cfg:v2";
const CHAVE_SES = "gabinete-sessao:v1";
const PALETA = ["#2A5D8F","#7A4E9C","#1B6B48","#B3261E","#A8710F","#4A5568","#0E7490","#9B3B6E"];
const TOMBO = 45 * 86400000;           // tempo que os registros excluídos ficam guardados
const RAPIDO = 3000;                   // checagem enquanto a pessoa está usando
const LENTO  = 15000;                  // checagem quando ocioso ou em segundo plano
const OCIO   = 120000;                 // tempo sem toque para considerar ocioso
let ultimaAcao = Date.now();

/* =================== utilidades =================== */

function id(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function agora(){ return Date.now(); }
function HOJE(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function iniciais(n){ return (n||"").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase() || "?"; }

function cor(txt){
  if(!txt) return "#C3CCDC";
  let h = 0;
  for(let i=0;i<txt.length;i++) h = (h*31 + txt.charCodeAt(i)) % 9973;
  return PALETA[h % PALETA.length];
}
function diasAte(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+"T00:00:00") - HOJE()) / 86400000);
}
function rotuloPrazo(iso){
  const d = diasAte(iso);
  if(d === null) return null;
  if(d < -1) return { txt:Math.abs(d)+" d atrás", cls:"vencido" };
  if(d === -1) return { txt:"ontem", cls:"vencido" };
  if(d === 0) return { txt:"hoje", cls:"vencido" };
  if(d === 1) return { txt:"amanhã", cls:"perto" };
  if(d <= 7) return { txt:"em "+d+" d", cls:"perto" };
  const dt = new Date(iso+"T00:00:00");
  return { txt:String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0"), cls:"" };
}
function brinde(msg){
  const el = document.getElementById("brinde");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2600);
}

function foneLimpo(f){

  if(!d) return "";
  return d.length <= 11 ? "55" + d : d;

}

/** dias até o próximo aniversário, para ordenar a lista */
function proximoAniversario(iso){
  if(!iso) return null;
  const [ , m, d] = String(iso).split("-").map(Number);
  if(!m || !d) return null;
  const hoje = HOJE();
  let alvo = new Date(hoje.getFullYear(), m-1, d);
  if(alvo < hoje) alvo = new Date(hoje.getFullYear()+1, m-1, d);
  return Math.round((alvo - hoje) / 86400000);
}

/* ---------- links do Google Drive ---------- */
function tipoDrive(url){
  const u = String(url || "");
  if(!u) return null;
  if(/docs\.google\.com\/document/.test(u))      return { r:"Documento",     i:"📄" };
  if(/docs\.google\.com\/spreadsheets/.test(u))  return { r:"Planilha",      i:"▦" };
  if(/docs\.google\.com\/presentation/.test(u))  return { r:"Apresentação",  i:"▤" };
  if(/docs\.google\.com\/forms/.test(u))         return { r:"Formulário",    i:"☑" };
  if(/drive\.google\.com\/drive\/folders/.test(u)) return { r:"Pasta do Drive", i:"🗀" };
  if(/drive\.google\.com/.test(u))                return { r:"Arquivo no Drive", i:"🗎" };
  if(/^https?:\/\//.test(u))                      return { r:"Link",          i:"🔗" };
  return null;
}
function linkValido(u){ return /^https?:\/\//i.test(String(u||"").trim()); }

function folhaLinkDrive(tipo, alvoId){
  const alvo = tipo === "pasta" ? estado.pastas[alvoId] : estado.cartoes[alvoId];
  if(!alvo) return;
  const t = tipoDrive(alvo.link);
  abrirFolha(
    '<h2>Link do Google Drive</h2>'
    + '<p>Cole o endereço de um documento, planilha ou pasta do Drive. '
    + 'Quem abrir ' + (tipo === "pasta" ? "esta pasta" : "esta tarefa") + ' vê um atalho direto para ele.</p>'
    + '<div class="campo"><label for="dvLink">Endereço</label>'
    + '<input id="dvLink" value="'+esc(alvo.link || "")+'" placeholder="https://docs.google.com/document/d/…" '
    + 'autocapitalize="off" spellcheck="false"></div>'
    + '<div class="campo"><label for="dvNome">Como chamar</label>'
    + '<input id="dvNome" value="'+esc(alvo.linkNome || "")+'" placeholder="Ofício 245/2026"></div>'
    + (t ? '<div class="aviso bom">Reconhecido como '+t.r+'.</div>' : '')
    + '<div class="aviso">O link só abre para quem já tem permissão no Drive. Confira o compartilhamento lá antes de espalhar.</div>'
    + '<div class="acoes">'
    + (alvo.link ? '<button class="btn perigo" id="dvTirar" aria-label="Tirar o link">✕</button>' : '')
    + '<button class="btn claro" data-fechar="1">Cancelar</button>'
    + '<button class="btn" id="dvSalvar">Salvar</button></div>'
  );
  const tirar = document.getElementById("dvTirar");
  if(tirar) tirar.addEventListener("click", () => {
    delete alvo.link; delete alvo.linkNome; tocar(alvo);
    fecharFolha(); mudou(); desenhar();
  });
  document.getElementById("dvSalvar").addEventListener("click", () => {
    const u = document.getElementById("dvLink").value.trim();
    if(u && !linkValido(u)){ brinde("O endereço precisa começar com https://"); return; }
    if(u){ alvo.link = u; alvo.linkNome = document.getElementById("dvNome").value.trim(); }
    else { delete alvo.link; delete alvo.linkNome; }
    tocar(alvo);
    fecharFolha(); mudou(); desenhar();
    if(tipo === "pasta") folhaPastas();
  });
}

function digitando(){
  const a = document.activeElement;
  if(!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  // campo dentro de uma folha já fechada não conta como "está digitando"
  const f = document.getElementById("folha");
  if(f && f.contains(a) && !f.classList.contains("on")) return false;
  return true;
}
const quem    = mid => (estado.membros || {})[mid];

function idMembro(nome){
  const base = String(nome||"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return base ? "m-" + base : "";
}

/** registra quem está usando o quadro, para aparecer na lista de responsáveis */
function registrarMembro(){
  if(!cfg.eu) return false;
  const mid = idMembro(cfg.eu);
  if(!mid) return false;
  const atual = (estado.membros || {})[mid];
  const m = atual || { id:mid };
  m.nome = cfg.eu.trim();
  m.visto = agora();
  m.mod = agora();
  delete m.del;
  estado.membros = estado.membros || {};
  estado.membros[mid] = m;
  return true;
}

function tocar(o){ o.mod = agora(); o.por = cfg.eu || ""; return o; }

/** entrou numa coluna de encerramento: conclui. saiu de uma: reabre. */
function ajustarFeito(c, colunaAntes){
  const nova = estado.colunas[c.coluna];
  const velha = colunaAntes ? estado.colunas[colunaAntes] : null;
  if(nova && nova.final){ if(!c.feito) c.feito = agora(); return; }
  if(velha && velha.final && c.feito) c.feito = 0;
}

function logar(texto){
  estado.log = estado.log || [];
  estado.log.push({ q: cfg.eu || "sem nome", t: agora(), d: String(texto).slice(0,90) });
  if(estado.log.length > 60) estado.log = estado.log.slice(-60);
}
function unirEventos(a, b, max){
  const vistos = {};
  const todos = [].concat(a || [], b || []);
  const fora = [];
  todos.forEach(e => {
    const ch = e.q + "|" + e.t + "|" + (e.a || "") + "|" + (e.d || "");
    if(!vistos[ch]){ vistos[ch] = 1; fora.push(e); }
  });
  fora.sort((x,y) => x.t - y.t);
  return fora.slice(-max);
}
function carimbo(ts){

function ordemEntre(antes, depois){
  const a = antes ? estado.cartoes[antes] : null;
  const b = depois ? estado.cartoes[depois] : null;
  if(a && b){
    const meio = (a.ordem + b.ordem) / 2;
    if(meio > a.ordem && meio < b.ordem) return meio;
    return null; // precisa renumerar a coluna
  }
  if(b) return b.ordem - 1;
  if(a) return a.ordem + 1;
  return 0;
}

/* ------- conversão do formato antigo (v1) ------- */
function migrar(v){
  if(!v) return null;
  if(v.versao === 2 && v.pastas && !Array.isArray(v.pastas)) return completar(v);
  if(!Array.isArray(v.pastas)) return null;
  const doc = { versao:2, titulo:v.titulo||"Central do Gabinete", tituloMod:0,
                subtitulo:v.subtitulo||"", subMod:0, pastas:{}, colunas:{}, cartoes:{} };
  v.pastas.forEach((p,pi) => {
    const pid = p.id || id("p");
    doc.pastas[pid] = { id:pid, nome:p.nome, ordem:pi, mod:agora(), por:"" };
    (p.colunas||[]).forEach((k,ki) => {
      const kid = k.id || id("k");
      doc.colunas[kid] = { id:kid, pasta:pid, nome:k.nome, ordem:ki, mod:agora(), por:"" };
      (k.cartoes||[]).forEach((c,ci) => {
        const cid = c.id || id("c");
        doc.cartoes[cid] = { id:cid, coluna:kid, ordem:ci, n:c.n||0, titulo:c.titulo,
                             etiqueta:c.etiqueta||"", prazo:c.prazo||"", prioridade:c.prioridade||"normal",
                             notas:c.notas||"", mod:agora(), por:"" };
      });
    });
  });
  let n = 0;
  Object.values(doc.cartoes).forEach(c => { if(!c.n) c.n = ++n; else n = Math.max(n, c.n); });
  return doc;
}

/** completa campos que versões anteriores do arquivo não tinham */
const NOME_FINAL = /conclu|encerr|resolv|arquiv|finaliz|entregue|atendid/i;

function completar(doc){
  if(!doc.membros) doc.membros = {};
  if(!doc.regras) doc.regras = { exclusao:"dono", mod:0 };
  if(!doc.log) doc.log = [];
  if(!doc.marcouFinal){
    // primeira vez: descobre pelo nome quais colunas significam "acabou"
    Object.values(doc.colunas || {}).forEach(k => {
      if(k.final === undefined) k.final = NOME_FINAL.test(k.nome || "");
    });
    // e considera concluído o que já estava parado nessas colunas
    Object.values(doc.cartoes || {}).forEach(c => {
      if(c.feito === undefined){
        const k = (doc.colunas || {})[c.coluna];
        c.feito = (k && k.final) ? (c.mod || agora()) : 0;
      }
    });
    doc.marcouFinal = true;
  }
  if(!doc.contatos) doc.contatos = {};
  if(!doc.verba) doc.verba = { teto:0, mod:0, lancamentos:{} };
  if(!doc.verba.lancamentos) doc.verba.lancamentos = {};
  if(!doc.pessoal) doc.pessoal = {};
  if(!doc.app) doc.app = { v:VERSAO_APP, mod:agora() };
  else if((doc.app.v || 0) < VERSAO_APP) doc.app = { v:VERSAO_APP, mod:agora() };
  if(!doc.marca) doc.marca = { selo:"carimbo", mono:"CG", cor:"#C8A63C", mod:0 };
  return doc;
}

/* ------- mesclagem ------- */
function fundirMapa(x, y, comHist){
  const out = {};
  const chaves = new Set(Object.keys(x||{}).concat(Object.keys(y||{})));
  chaves.forEach(k => {
    const a = (x||{})[k], b = (y||{})[k];
    if(!a){ out[k] = b; return; }
    if(!b){ out[k] = a; return; }
    const venceu = (b.mod||0) > (a.mod||0) ? b : a;
    // o histórico é somado dos dois lados, senão a edição perdedora sumiria do registro
    if(comHist && (a.hist || b.hist)) venceu.hist = unirEventos(a.hist, b.hist, 12);
    out[k] = venceu;
  });
  return out;
}
function fundir(local, remoto){
  if(!remoto || !remoto.pastas) return local;
  return {
    versao:2,
    titulo:    (remoto.tituloMod||0) > (local.tituloMod||0) ? remoto.titulo : local.titulo,
    tituloMod: Math.max(local.tituloMod||0, remoto.tituloMod||0),
    subtitulo: (remoto.subMod||0) > (local.subMod||0) ? remoto.subtitulo : local.subtitulo,
    subMod:    Math.max(local.subMod||0, remoto.subMod||0),
    app:     ((remoto.app||{}).v||0) > ((local.app||{}).v||0) ? remoto.app : (local.app || remoto.app),
    marca:   ((remoto.marca||{}).mod||0) > ((local.marca||{}).mod||0) ? remoto.marca : (local.marca || remoto.marca),
    pastas:  fundirMapa(local.pastas,  remoto.pastas),
    colunas: fundirMapa(local.colunas, remoto.colunas),
    cartoes: fundirMapa(local.cartoes, remoto.cartoes, true),
    membros:  fundirMapa(local.membros  || {}, remoto.membros  || {}),
    contatos: fundirMapa(local.contatos || {}, remoto.contatos || {}, true),
    verba: {
      teto: ((remoto.verba||{}).mod||0) > ((local.verba||{}).mod||0) ? (remoto.verba||{}).teto : (local.verba||{}).teto,
      mod: Math.max((local.verba||{}).mod||0, (remoto.verba||{}).mod||0),
      lancamentos: fundirMapa((local.verba||{}).lancamentos || {}, (remoto.verba||{}).lancamentos || {})
    },
    pessoal: fundirMapa(local.pessoal || {}, remoto.pessoal || {}, true),
    dono:   ((remoto.regras||{}).mod||0) > ((local.regras||{}).mod||0) ? remoto.dono : (local.dono || remoto.dono),
    regras: ((remoto.regras||{}).mod||0) > ((local.regras||{}).mod||0) ? remoto.regras : (local.regras || remoto.regras),
    log:    unirEventos(local.log, remoto.log, 60)
  };
}
function limparTumulos(doc){
  const corte = agora() - TOMBO;
  if(doc.verba && doc.verba.lancamentos){
    Object.keys(doc.verba.lancamentos).forEach(k => {
      const r = doc.verba.lancamentos[k];
      if(r.del && (r.mod||0) < corte) delete doc.verba.lancamentos[k];
    });
  }
  ["pastas","colunas","cartoes","membros","contatos","pessoal"].forEach(m => {
    Object.keys(doc[m]).forEach(k => { if(doc[m][k].del && (doc[m][k].mod||0) < corte) delete doc[m][k]; });
  });
  return doc;
}

/* Dentro do Claude existe window.storage. Hospedado num endereço próprio,
   não existe — aí o app usa o armazenamento do próprio navegador. */
let _armazem;
function armazem(){
  if(_armazem !== undefined) return _armazem;
  if(typeof window.storage !== "undefined") return (_armazem = "claude");
  try{
    window.localStorage.setItem("__teste__","1");
    window.localStorage.removeItem("__teste__");
    return (_armazem = "navegador");
  }catch(e){ semArmazenamento = true; return (_armazem = null); }
}
async function lerLocal(chave){
  const a = armazem();
  try{
    if(a === "claude"){
      const r = await window.storage.get(chave, false);
      return r && r.value ? JSON.parse(r.value) : null;
    }
    if(a === "navegador"){
      const v = window.localStorage.getItem(chave);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ return null; }
  return null;
}
async function gravarLocal(chave, valor){
  const a = armazem();
  try{
    if(a === "claude"){ await window.storage.set(chave, JSON.stringify(valor), false); return; }
    if(a === "navegador"){ window.localStorage.setItem(chave, JSON.stringify(valor)); return; }
    semArmazenamento = true;
  }catch(e){ semArmazenamento = true; }
}
function salvarLocal(){
  clearTimeout(salvamento);
  salvamento = setTimeout(() => gravarLocal(CHAVE_DOC, estado), 300);
}
/** toda alteração passa por aqui: grava no aparelho e agenda o envio */
function mudou(){ if(estado) estado.virgem = false; salvarLocal(); Sinc.agendar(); }

const Auth = {
  base(){ return cfg.url.replace(/\/+$/,"") + "/auth/v1"; },

  /** endereço para onde o link do e-mail deve devolver a pessoa */
  volta(){
    return (location.protocol === "http:" || location.protocol === "https:") && location.host
      ? location.origin + location.pathname : "";
  },

  async pedirCodigo(email){
    const v = this.volta();
    const r = await fetch(this.base() + "/otp" + (v ? "?redirect_to=" + encodeURIComponent(v) : ""), {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":cfg.chave },
      body: JSON.stringify({ email: String(email).trim().toLowerCase(), create_user: true })
    });
    const t = await r.text();
    if(!r.ok) throw new Error(detalhe(t) || ("HTTP " + r.status));
    return true;
  },

  async conferirCodigo(email, codigo){
    const r = await fetch(this.base() + "/verify", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":cfg.chave },
      body: JSON.stringify({ email: String(email).trim().toLowerCase(), token: String(codigo).trim(), type:"email" })
    });
    const t = await r.text();
    if(!r.ok){
      const d0 = detalhe(t);
      throw new Error(d0 || (r.status === 403 || r.status === 401
        ? "Código incorreto ou já vencido. Peça um novo em “Reenviar código”."
        : "HTTP " + r.status));
    }
    const d = JSON.parse(t);
    sessao = {
      token: d.access_token, refresh: d.refresh_token,
      expira: agora() + ((d.expires_in || 3600) * 1000) - 60000,
      email: (d.user && d.user.email) || String(email).trim().toLowerCase(),
      nome: "", papel: "membro"
    };
    return sessao;
  },

  async renovar(){
    if(!sessao || !sessao.refresh) return false;
    const r = await fetch(this.base() + "/token?grant_type=refresh_token", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":cfg.chave },
      body: JSON.stringify({ refresh_token: sessao.refresh })
    });
    const t = await r.text();
    if(!r.ok){ sessao = null; return false; }
    const d = JSON.parse(t || "{}");
    sessao.token = d.access_token;
    sessao.refresh = d.refresh_token || sessao.refresh;
    sessao.expira = agora() + ((d.expires_in || 3600) * 1000) - 60000;
    gravarLocal(CHAVE_SES, sessao);
    return true;
  },

  /** com o token na mão, pergunta ao servidor de quem ele é */
  async quemSou(){
    if(!sessao) return null;
    const r = await fetch(this.base() + "/user", {
      headers:{ "apikey":cfg.chave, "Authorization":"Bearer " + sessao.token }
    });
    const t = await r.text();
    if(!r.ok) return null;
    const d = JSON.parse(t || "{}");
    if(d.email) sessao.email = d.email;
    return d.email || null;
  },

  async valido(){
    if(!sessao) return false;
    if(agora() < sessao.expira) return true;
    return await this.renovar();
  },

  sair(){ sessao = null; gravarLocal(CHAVE_SES, null); }
};

/** cabecalhos com o token da pessoa quando o modo e login */
function cabAuth(){
  const c = { "Content-Type":"application/json", "apikey":cfg.chave };
  if(cfg.modo === "login" && sessao) c["Authorization"] = "Bearer " + sessao.token;
  else if(/^eyJ/.test(cfg.chave)) c["Authorization"] = "Bearer " + cfg.chave;
  return c;
}

function cabecalhos(chave){
  // chave nova (sb_publishable_...) vai só no apikey;
  // a antiga (JWT, começa com eyJ) aceita também o Authorization
  const c = { "Content-Type":"application/json", "apikey":chave };
  if(/^eyJ/.test(chave)) c["Authorization"] = "Bearer " + chave;
  return c;
}
function detalhe(txt){
  if(!txt) return "";
  let m = "";
  try{ const j = JSON.parse(txt); m = j.message || j.hint || j.error_description || j.error || ""; }
  catch(e){ m = String(txt).slice(0,140); }
  return traduzir(m);
}

/** as mensagens do Supabase vêm em inglês; as mais comuns viram português */
function traduzir(m){
  const t = String(m || "");
  if(/expired or is invalid|invalid.*token|otp.*expired/i.test(t))
    return "Código incorreto ou já vencido. Peça um novo em “Reenviar código”.";
  if(/rate limit|too many requests|for security purposes/i.test(t))
    return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
  if(/signups not allowed|not authorized|user not found/i.test(t))
    return "Este e-mail não está liberado para entrar.";
  if(/error sending|smtp|mail/i.test(t))
    return "O servidor não conseguiu enviar o e-mail. Confira a configuração de SMTP.";
  if(/invalid.*email/i.test(t)) return "E-mail inválido.";
  return t;
}

const Sinc = {
  ligado:false, versao:null, status:"local", ultimoOk:null,
  timer:null, envio:null, retentar:null, ocupado:false, sujo:false, erro:"",

  url(fn){ return cfg.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn; },

  async rpc(fn, corpo){
    // chave nova (sb_publishable_...) vai só no cabeçalho apikey;
    // a chave antiga (JWT, começa com eyJ) aceita também o Authorization
    const r = await fetch(this.url(fn), { method:"POST", headers:cabecalhos(cfg.chave), body:JSON.stringify(corpo) });
    const t = await r.text();
    if(!r.ok){
      const e = new Error("HTTP " + r.status + (detalhe(t) ? " — " + detalhe(t) : ""));
      e.status = r.status;
      throw e;
    }
    return t ? JSON.parse(t) : null;
  },

  marcar(s, erro){
    this.status = s; this.erro = erro || "";
    if(s === "ok") this.ultimoOk = agora();
    pintarStatus();
  },

  rest(caminho){ return cfg.url.replace(/\/+$/,"") + "/rest/v1/" + caminho; },

  /** as três operações abaixo têm duas implementações: RPC com senha, ou REST com token */
  async lerVersao(){
    if(cfg.modo === "login"){
      if(!await Auth.valido()) throw new Error("sessão expirada");
      const r = await fetch(this.rest("quadros?id=eq." + encodeURIComponent(cfg.quadro) + "&select=versao"), { headers: cabAuth() });
      const t = await r.text();
      if(!r.ok) throw new Error(detalhe(t) || ("HTTP " + r.status));
      const arr = JSON.parse(t || "[]");
      return arr.length ? arr[0].versao : null;
    }
    return await this.rpc("versao_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
  },

  async lerTudo(){
    if(cfg.modo === "login"){
      if(!await Auth.valido()) throw new Error("sessão expirada");
      const r = await fetch(this.rest("quadros?id=eq." + encodeURIComponent(cfg.quadro)
        + "&select=dados,versao,atualizado_em,atualizado_por"), { headers: cabAuth() });
      const t = await r.text();
      if(!r.ok) throw new Error(detalhe(t) || ("HTTP " + r.status));
      return JSON.parse(t || "[]");
    }
    return await this.rpc("ler_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
  },

  async gravarTudo(dados, versaoAtual){
    if(cfg.modo === "login"){
      if(!await Auth.valido()) throw new Error("sessão expirada");
      const r = await fetch(this.rest("quadros?id=eq." + encodeURIComponent(cfg.quadro)
        + "&versao=eq." + versaoAtual + "&select=versao"), {
        method:"PATCH",
        headers: Object.assign(cabAuth(), { "Prefer":"return=representation" }),
        body: JSON.stringify({ dados: dados, versao: versaoAtual + 1,
          atualizado_em: new Date().toISOString(), atualizado_por: cfg.eu || sessao.email })
      });
      const t = await r.text();
      if(!r.ok) throw new Error(detalhe(t) || ("HTTP " + r.status));
      const arr = JSON.parse(t || "[]");
      return arr.length ? arr[0].versao : null;     // vazio = outra pessoa gravou antes
    }
    return await this.rpc("gravar_quadro", {
      p_id:cfg.quadro, p_senha:cfg.senha, p_dados:dados, p_versao:versaoAtual, p_por:cfg.eu || "alguém"
    });
  },

  async garantirQuadro(){
    if(cfg.modo !== "login"){
      await this.rpc("criar_quadro", { p_id:cfg.quadro, p_senha:cfg.senha });
      return;
    }
    const arr = await this.lerTudo();
    if(arr && arr.length) return;
    const r = await fetch(this.rest("quadros"), {
      method:"POST",
      headers: Object.assign(cabAuth(), { "Prefer":"resolution=ignore-duplicates" }),
      body: JSON.stringify({ id:cfg.quadro, dados:{}, versao:0 })
    });
    if(!r.ok){ const t = await r.text(); throw new Error(detalhe(t) || ("HTTP " + r.status)); }
  },

  /** traz a lista de autorizados e reflete na equipe do quadro */
  async lerAutorizados(){
    if(cfg.modo !== "login") return [];
    const r = await fetch(this.rest("membros_autorizados?select=email,nome,papel"), { headers: cabAuth() });
    const t = await r.text();
    if(!r.ok) return [];
    const lista = JSON.parse(t || "[]");
    const meu = lista.find(m => String(m.email).toLowerCase() === String(sessao.email).toLowerCase());
    if(meu){ sessao.nome = meu.nome; sessao.papel = meu.papel; cfg.eu = meu.nome; }
    let mexeu = false;
    estado.membros = estado.membros || {};
    lista.forEach(m => {
      const mid = idMembro(m.nome);
      if(!mid) return;
      const atual = estado.membros[mid];
      if(!atual || atual.nome !== m.nome || atual.del){
        estado.membros[mid] = { id:mid, nome:m.nome, visto:agora(), mod:agora() };
        mexeu = true;
      }
    });
    return mexeu ? lista : lista;
  },

  async conectar(silencioso){
    if(!cfg.url || !cfg.chave) { this.desligar(); return false; }
    if(cfg.modo === "senha" && !cfg.senha){ this.desligar(); return false; }
    if(cfg.modo === "login" && !(await Auth.valido())){
      this.desligar();
      if(!silencioso) folhaLogin();
      return false;
    }
    this.marcar("enviando");
    try{
      await this.lerAutorizados();
      await this.garantirQuadro();
      const linhas = await this.lerTudo();
      if(!linhas || !linhas.length){
        this.marcar("erro", cfg.modo === "login" ? "acesso" : "senha");
        if(!silencioso) brinde(cfg.modo === "login"
          ? "Seu e-mail não está na lista de autorizados deste quadro."
          : "Senha do quadro não confere com a do servidor.");
        return false;
      }
      const linha = linhas[0];
      this.versao = linha.versao;
      const remoto = linha.dados && linha.dados.pastas ? linha.dados : null;
      if(remoto){
        // quadro ainda intocado neste aparelho: adota o da equipe inteiro,
        // para não empurrar os cartões de exemplo para dentro do quadro alheio
        estado = completar(limparTumulos(estado.virgem ? remoto : fundir(estado, remoto)));
        estado.virgem = false;
        salvarLocal(); ajustarVista(); conferirVersao(); desenhar();
      }
      this.ligado = true;
      this.marcar("ok");
      if(registrarMembro()){ salvarLocal(); desenharAbas(); }
      await this.enviar();          // sobe o que houver de local
      this.iniciarRelogio();
      return true;
    }catch(e){
      this.marcar("erro", String(e.message||e));
      if(!silencioso) brinde(String(e.message||e).indexOf("HTTP") === 0
        ? "Servidor recusou: " + e.message
        : "A chamada não saiu do navegador. Toque em “Testar conexão”.");
      clearTimeout(this.retentar);
      this.retentar = setTimeout(() => {
        if(cfg.url && cfg.chave && cfg.senha && !this.ligado) this.conectar(true);
      }, 15000);
      return false;
    }
  },

  desligar(){
    this.ligado = false; this.versao = null; this.sujo = false;
    clearTimeout(this.timer); this.timer = null;
    clearTimeout(this.retentar); this.retentar = null;
    this.marcar("local");
  },

  iniciarRelogio(){
    clearTimeout(this.timer);
    const passo = async () => {
      if(this.ligado && !document.hidden && !arrasto){
        await this.puxar();
        if(this.sujo) await this.enviar();   // reenvia o que ficou preso offline
      }
      const ocioso = (agora() - ultimaAcao) > OCIO;
      this.timer = setTimeout(passo, (document.hidden || ocioso) ? LENTO : RAPIDO);
    };
    this.timer = setTimeout(passo, RAPIDO);
  },

  /** checa a versão no servidor (barato) e só baixa o documento se mudou */
  async puxar(){
    if(!this.ligado || this.ocupado) return;
    this.ocupado = true;
    try{
      const v = await this.lerVersao();
      if(v === null || v === undefined){ this.marcar("erro", cfg.modo === "login" ? "acesso" : "senha"); this.ocupado = false; return; }
      if(v === this.versao){ this.marcar("ok"); this.ocupado = false; return; }
      const linhas = await this.lerTudo();
      if(linhas && linhas.length){
        const linha = linhas[0];
        this.versao = linha.versao;
        if(linha.dados && linha.dados.pastas){
          estado = completar(limparTumulos(fundir(estado, linha.dados)));
          salvarLocal(); ajustarVista(); conferirVersao();
          if(!arrasto && !folha.classList.contains("on") && !digitando()) desenhar(); else desenharAbas();
          if(linha.atualizado_por && linha.atualizado_por !== cfg.eu) brinde("Quadro atualizado por " + linha.atualizado_por + ".");
        }
      }
      this.marcar("ok");
    }catch(e){ this.marcar("erro", String(e.message||e)); }
    this.ocupado = false;
  },

  agendar(){
    if(!this.ligado){ return; }
    this.sujo = true;
    clearTimeout(this.envio);
    this.envio = setTimeout(() => this.enviar(), 900);
    this.marcar("enviando");
  },

  async enviar(tentativa){
    if(!this.ligado || this.ocupado) return;
    tentativa = tentativa || 0;
    this.ocupado = true;
    try{
      const nova = await this.gravarTudo(Object.assign({}, estado, { virgem:undefined }), this.versao);
      if(nova === null || nova === undefined){
        // outra pessoa gravou antes: baixa, mescla e tenta de novo
        this.ocupado = false;
        if(tentativa >= 3){ this.marcar("erro","conflito"); return; }
        await this.puxar();
        return this.enviar(tentativa + 1);
      }
      this.versao = nova; this.sujo = false;
      this.marcar("ok");
    }catch(e){ this.marcar("erro", String(e.message||e)); }
    this.ocupado = false;
  }
};

function conferirVersao(){
  if(((estado.app || {}).v || 0) > VERSAO_APP){
    document.getElementById("faixaNova").classList.add("on");
  }
}

function pintarStatus(){
  const ponto = document.getElementById("ponto");
  const txt = document.getElementById("txtStatus");
  ponto.className = "ponto";
  if(!Sinc.ligado){
    txt.textContent = semArmazenamento ? "Sem salvamento automático" : "Só neste aparelho";
    if(Sinc.status === "erro") ponto.classList.add("erro");
    return;
  }
  if(Sinc.status === "enviando"){ ponto.classList.add("enviando"); txt.textContent = "Enviando…"; return; }
  if(Sinc.status === "erro"){
    ponto.classList.add("erro");
    txt.textContent = Sinc.erro === "senha" ? "Senha recusada"
      : Sinc.erro === "acesso" ? "Acesso não autorizado"
      : "Sem conexão · guardado aqui";
    return;
  }
  ponto.classList.add("on");
  const d = new Date(Sinc.ultimoOk || agora());
  txt.textContent = "Sincronizado · " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS_S = ["D","S","T","Q","Q","S","S"];

function chaveDia(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function desenharCalendario(){
  const ref = vista.mesPrazo ? new Date(vista.mesPrazo + "-01T12:00:00") : new Date();
  const ano = ref.getFullYear(), mes = ref.getMonth();
  const ym = ano + "-" + String(mes+1).padStart(2,"0");

  const porDia = {};
  vivas(estado.cartoes).filter(c => c.prazo && !c.feito && estado.colunas[c.coluna] && !estado.colunas[c.coluna].del)
    .forEach(c => { (porDia[c.prazo] = porDia[c.prazo] || []).push(c); });

  const primeiro = new Date(ano, mes, 1);
  const total = new Date(ano, mes + 1, 0).getDate();
  const inicio = primeiro.getDay();
  const hojeK = chaveDia(HOJE());
  const sel = vista.diaPrazo;

  let h = '<div class="rolo">' + barraPrazos("calendario");
  h += '<div class="cal">'
     + '<div class="cal-topo"><button class="nav" data-mes="-1">‹</button>'
     + '<span>'+MESES[mes]+' de '+ano+'</span>'
     + '<button class="nav" data-mes="1">›</button></div>'
     + '<div class="cal-grade">'
     + DIAS_S.map(d => '<div class="cal-ds">'+d+'</div>').join("");
  for(let i = 0; i < inicio; i++) h += '<div class="cal-vazio"></div>';
  for(let d = 1; d <= total; d++){
    const k = ano + "-" + String(mes+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const lista = porDia[k] || [];
    const atrasado = lista.length && k < hojeK;
    let cls = "cal-dia";
    if(k === hojeK) cls += " hoje";
    if(lista.length) cls += atrasado ? " vencido" : " tem";
    if(k === sel) cls += " sel";
    h += '<button class="'+cls+'" data-dia="'+k+'"><span class="n">'+d+'</span>'
       + (lista.length ? '<span class="pt">'+(lista.length > 3 ? 3 : lista.length)+'</span>' : '')
       + '</button>';
  }
  h += '</div></div>';

  const doDia = sel ? (porDia[sel] || []) : [];
  if(sel){
    const dt = new Date(sel + "T12:00:00");
    h += '<div class="grupo"><h3>'+dt.getDate()+' de '+MESES[dt.getMonth()]+'</h3>';
    if(!doDia.length) h += '<div class="nada">Nenhum prazo neste dia.</div>';
    doDia.forEach(c => { h += linhaPrazo(c); });
    h += '</div>';
  }else{
    const doMes = Object.keys(porDia).filter(k => k.slice(0,7) === ym).sort();
    h += '<div class="grupo"><h3>'+MESES[mes]+' · '+doMes.reduce((s,k)=>s+porDia[k].length,0)+' prazo(s)</h3>';
    if(!doMes.length) h += '<div class="nada">Nenhum prazo em aberto neste mês.<br>Toque nas setas para ver outro.</div>';
    doMes.forEach(k => porDia[k].forEach(c => { h += linhaPrazo(c); }));
    h += '</div>';
  }
  document.getElementById("tela").innerHTML = h + '</div>';

  document.querySelectorAll("[data-mes]").forEach(b => b.addEventListener("click", () => {
    const d = new Date(ano, mes + parseInt(b.dataset.mes,10), 1);
    vista.mesPrazo = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    vista.diaPrazo = null;
    desenharCalendario();
  }));
  document.querySelectorAll("[data-dia]").forEach(b => b.addEventListener("click", () => {
    vista.diaPrazo = (vista.diaPrazo === b.dataset.dia) ? null : b.dataset.dia;
    desenharCalendario();
  }));
}

function linhaPrazo(c){
  const r = rotuloPrazo(c.prazo);
  return '<button class="linha-item" data-cartao="'+c.id+'"><span class="prazo '+r.cls+'">'+r.txt+'</span>'
    + '<span style="flex:1;min-width:0"><span class="tit">'+esc(c.titulo)+'</span><br>'
    + '<span class="onde">'+esc(ondeEsta(c))+'</span></span></button>';
}

function barraPrazos(atual){
  return '<div class="segm" style="margin-bottom:14px">'
    + '<button type="button" data-vprazo="lista" aria-pressed="'+(atual==="lista")+'">Lista</button>'
    + '<button type="button" data-vprazo="calendario" aria-pressed="'+(atual==="calendario")+'">Calendário</button>'
    + '</div>';
}

function desenharPrazos(){
  if(vista.prazoVista === "calendario") return desenharCalendario();
  const itens = vivas(estado.cartoes).filter(c => c.prazo && !c.feito && estado.colunas[c.coluna] && !estado.colunas[c.coluna].del)
                  .map(c => ({ c, d:diasAte(c.prazo) })).sort((a,b) => a.d - b.d);
  const grupos = [
    { t:"Vencidos", f:i => i.d < 0, u:true },
    { t:"Hoje", f:i => i.d === 0, u:true },
    { t:"Esta semana", f:i => i.d > 0 && i.d <= 7 },
    { t:"Próximas semanas", f:i => i.d > 7 && i.d <= 30 },
    { t:"No horizonte", f:i => i.d > 30 }
  ];
  let h = '<div class="rolo">' + barraPrazos("lista");
  if(!itens.length) h += '<div class="nada">Nenhuma tarefa com prazo.<br>Abra uma tarefa e defina a data para ela aparecer aqui.</div>';
  grupos.forEach(g => {
    const lista = itens.filter(g.f);
    if(!lista.length) return;
    h += '<div class="grupo'+(g.u?" urgente":"")+'"><h3>'+g.t+'</h3>';
    lista.forEach(i => {
      const r = rotuloPrazo(i.c.prazo);
      h += linhaPrazo(i.c);
    });
    h += '</div>';
  });
  document.getElementById("tela").innerHTML = h + '</div>';
}

  const meses = {};

     + '<div class="barra"><div class="cheio'+(saldo < 0 ? " estourou" : "")+'" style="width:'+perc+'%"></div></div>'
     + '<div class="linha2"><div><span class="n">'+dinheiro(gasto)+'</span><span class="r">gasto</span></div>'
     + '<div><span class="n'+(teto && saldo < 0 ? " ruim" : "")+'">'

     + '<div><span class="n">'+doMes.length+'</span><span class="r">lançamento'+(doMes.length===1?"":"s")+'</span></div></div>'

    h += '<div class="grupo"><h3>Por categoria</h3>';

    h += '<button class="linha-item" data-lanc="'+l.id+'">'
       + '<span class="prazo">'+dataBR(l.data).slice(0,5)+'</span>'
       + '<span style="flex:1;min-width:0"><span class="tit">'+esc(l.descricao)+'</span><br>'
       + '<span class="onde">'+esc(l.categoria || "Outros")+(l.fornecedor ? ' · '+esc(l.fornecedor) : '')+'</span></span>'
       + '<span class="valor">'+dinheiro(l.valor)+'</span></button>';

  h += '<div class="dica" style="margin-top:14px">Controle interno de acompanhamento. Não substitui a prestação de contas '
     + 'formal da verba de gabinete, que segue o que a Câmara exigir.</div>';

function exportarVerbaCSV(ym){
  const doMes = lancamentos().filter(l => mesDe(l.data) === ym);
  if(!doMes.length){ brinde("Nada para exportar neste mês."); return; }
  const c = x => '"' + String(x==null?"":x).replace(/"/g,'""') + '"';
  const linhas = [["Data","Descrição","Categoria","Fornecedor","Nota fiscal","Valor (R$)","Comprovante"].map(c).join(";")];
  doMes.slice().reverse().forEach(l => {
    linhas.push([dataBR(l.data), l.descricao, l.categoria, l.fornecedor, l.nota,
      (Number(l.valor)||0).toFixed(2).replace(".",","), l.link||""].map(c).join(";"));
  });
  const total = doMes.reduce((s,l) => s + (Number(l.valor)||0), 0);
  linhas.push("");
  linhas.push([c("Total"),c(""),c(""),c(""),c(""),c(total.toFixed(2).replace(".",",")),c("")].join(";"));
  linhas.push([c("Teto"),c(""),c(""),c(""),c(""),c((Number(VERBA().teto)||0).toFixed(2).replace(".",",")),c("")].join(";"));
  const blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "verba-" + ym + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  brinde("Planilha exportada.");
}

function desenharPessoal(){
  const lista = equipeRH();

  const aniversarios = lista.filter(p => p.nascimento && proximoAniversario(p.nascimento) !== null)
    .map(p => ({ p, d:proximoAniversario(p.nascimento) }))
    .filter(x => x.d <= 30).sort((a,b) => a.d - b.d);
  const emFerias = lista.filter(p => p.feriasIni && p.feriasFim
    && new Date(p.feriasIni+"T00:00:00") <= hoje && new Date(p.feriasFim+"T23:59:59") >= hoje);

  let h = '<div class="rolo">';
  if(emFerias.length)
    h += '<div class="aviso">Afastado agora: ' + emFerias.map(p => esc(p.nome)).join(", ") + '.</div>';
  if(aniversarios.length)
    h += '<div class="aviso bom">Aniversário à vista: '
       + aniversarios.map(x => esc(x.p.nome) + " (" + (x.d === 0 ? "hoje" : "em " + x.d + " d") + ")").join(", ") + '.</div>';

  if(!lista.length){
    h += '<div class="nada">Ninguém cadastrado.<br>Toque em + para incluir quem trabalha no gabinete.</div>';
  }
  lista.forEach(p => {
    const emF = emFerias.indexOf(p) > -1;
    h += '<button class="ficha" data-pessoa="'+p.id+'">'
       + '<span class="av" style="background:'+cor(p.nome)+'">'+esc(iniciais(p.nome))+'</span>'

       + '<span class="sub">'+esc([p.cargo, p.vinculo].filter(Boolean).join(" · "))+'</span></span>'
       + (emF ? '<span class="conta" style="color:var(--ambar);background:#FBF0DA">férias</span>' : '')

function desenharBusca(){
  const q = vista.busca.trim().toLowerCase();
  let h = '<div class="rolo">';
  if(!q){
    h += '<div class="nada">Digite para buscar por título, etiqueta ou anotação.</div>';
  }else{
    const achados = vivas(estado.cartoes).filter(c => (c.titulo+" "+c.etiqueta+" "+c.notas).toLowerCase().indexOf(q) > -1);
    const pessoas = agenda().filter(c => (c.nome+" "+(c.fone||"")+" "+(c.email||"")+" "+(c.bairro||"")).toLowerCase().indexOf(q) > -1);
    if(pessoas.length){
      h += '<div class="grupo"><h3>'+pessoas.length+' contato'+(pessoas.length>1?"s":"")+'</h3>';
      pessoas.forEach(c => {
        h += '<button class="ficha" data-contato="'+c.id+'">'
           + '<span class="av" style="background:'+cor(c.nome)+'">'+esc(iniciais(c.nome))+'</span>'
           + '<span style="flex:1;min-width:0"><span class="nome">'+esc(c.nome)+'</span>'
           + ((c.bairro||c.fone) ? '<br><span class="sub">'+esc([c.bairro,c.fone].filter(Boolean).join(" · "))+'</span>' : '')
           + '</span></button>';
      });
      h += '</div>';
    }
    if(!achados.length && !pessoas.length){
      h += '<div class="nada">Nada encontrado para “'+esc(vista.busca)+'”.</div>';
    }else if(achados.length){
      h += '<div class="grupo"><h3>'+achados.length+' tarefa'+(achados.length>1?"s":"")+'</h3>';
      achados.forEach(c => {
        h += '<button class="linha-item" data-cartao="'+c.id+'"><span style="flex:1;min-width:0">'
           + '<span class="tit">'+esc(c.titulo)+'</span><br><span class="onde">'+esc(ondeEsta(c))+'</span></span></button>';
      });
      h += '</div>';
    }
  }
  document.getElementById("tela").innerHTML = h + '</div>';
}

function desenhar(){
  document.getElementById("tituloApp").textContent = estado.titulo || "Central do Gabinete";
  pintarMarca();
  desenharAbas();
  if(vista.modo === "busca") desenharBusca();
  else if(vista.modo === "prazos") desenharPrazos();
  else if(vista.modo === "contatos") desenharContatos();
  else if(vista.modo === "admin") desenharAdmin();
  else if(vista.modo === "pessoal") desenharPessoal();
  else desenharQuadro();
  setTimeout(ajustarSetas, 0);
  document.getElementById("fab").style.display =
    ["quadro","contatos","admin","pessoal"].indexOf(vista.modo) > -1 ? "grid" : "none";
  pintarStatus();
}

/** mostra as setas da barra de abas só quando há aba escondida */
function ajustarSetas(){
  const nav = document.getElementById("abas");
  const e = document.getElementById("setaE");
  const d = document.getElementById("setaD");
  if(!nav || !e || !d) return;
  const sobra = nav.scrollWidth - nav.clientWidth;
  if(sobra < 8){ e.classList.remove("on"); d.classList.remove("on"); return; }
  e.classList.toggle("on", nav.scrollLeft > 4);
  d.classList.toggle("on", nav.scrollLeft < sobra - 4);
}

/* =================== folhas =================== */

const veu = document.getElementById("veu");
const folha = document.getElementById("folha");

function abrirFolha(html){
  folha.innerHTML = '<div class="puxador"></div>' + html;
  veu.classList.add("on"); folha.classList.add("on");
}
function fecharFolha(){
  const a = document.activeElement;
  if(a && a.blur && folha.contains(a)) a.blur();
  veu.classList.remove("on");
  folha.classList.remove("on");
  // limpa o conteúdo depois da animação, para não deixar campos órfãos no DOM
  setTimeout(() => { if(!folha.classList.contains("on")) folha.innerHTML = ""; }, 320);
}
veu.addEventListener("click", fecharFolha);

function pedirTexto(titulo, valor, aoConfirmar){
  abrirFolha('<h2>'+esc(titulo)+'</h2><div class="campo"><input id="txtEntrada" value="'+esc(valor||"")+'" autocomplete="off"></div>'
    + '<div class="acoes"><button class="btn claro" data-fechar="1">Cancelar</button><button class="btn" id="txtOk">Salvar</button></div>');
  const inp = document.getElementById("txtEntrada");
  setTimeout(() => { inp.focus(); inp.select(); }, 260);
  const ok = () => { const v = inp.value.trim(); if(v){ fecharFolha(); aoConfirmar(v); } };
  document.getElementById("txtOk").addEventListener("click", ok);
  inp.addEventListener("keydown", e => { if(e.key === "Enter") ok(); });
}

  });

  document.getElementById("fPrio").addEventListener("click", e => {
    const b = e.target.closest("button[data-p]");
    if(!b) return;
    [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  });

  document.getElementById("fResp").addEventListener("click", e => {
    const b = e.target.closest("button[data-r]");
    if(!b) return;
    [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  });

    const titulo = document.getElementById("fTitulo").value.trim();
    if(!titulo){ document.getElementById("fTitulo").focus(); brinde("Dê um título à tarefa."); return; }
    const dados = {
      titulo,
      etiqueta: document.getElementById("fEtiqueta").value.trim(),
      prazo: document.getElementById("fPrazo").value,
      prioridade: document.querySelector('#fPrio button[aria-pressed="true"]').dataset.p,
      resp: (document.querySelector('#fResp button[aria-pressed="true"]') || { dataset:{ r:"" } }).dataset.r,
      contatoId: document.getElementById("fContato").value,
      link: document.getElementById("fLink").value.trim(),
      linkNome: document.getElementById("fLinkNome").value.trim(),
      notas: document.getElementById("fNotas").value.trim()
    };
    const destino = document.getElementById("fLocal").value;
    const querFeito = document.querySelector('#fFeito button[aria-pressed="true"]').dataset.f === "1";
    if(c){
      const colunaAntes = c.coluna;
      Object.assign(c, dados);
      if(c.coluna !== destino){
        c.coluna = destino;
        const primeiro = cartoes(destino)[0];
        c.ordem = primeiro ? primeiro.ordem - 1 : 0;
        ajustarFeito(c, colunaAntes);
        registrar(c, "m", (estado.colunas[destino] || {}).nome);
      }
      if(querFeito && !c.feito){ c.feito = agora(); registrar(c, "f"); }
      else if(!querFeito && c.feito){ c.feito = 0; registrar(c, "r"); }
      else if(c.coluna === colunaAntes) registrar(c, "e");
      tocar(c);
    }else{
      const primeiro = cartoes(destino)[0];
      const novo = Object.assign({
        id:id("c"), coluna:destino, ordem: primeiro ? primeiro.ordem - 1 : 0, n:proximoN(),
        feito: querFeito ? agora() : 0, criadoPor: idMembro(cfg.eu), criadoEm: agora()
      }, dados);
      tocar(novo);
      registrar(novo, "c");
      ajustarFeito(novo, null);
      estado.cartoes[novo.id] = novo;
    }
    const k = estado.colunas[destino];
    if(k) vista.pasta = k.pasta;
    fecharFolha(); mudou();
    if(vista.modo !== "prazos") vista.modo = "quadro";
    desenhar();
  });
}

/** exclui direto se a regra permitir; senão registra um pedido para o responsável decidir */
function pedirOuExcluir(alvo, tipo, rotulo, aoTerminar){
  const excluir = () => {
    if(tipo === "contato") atendimentosDe(alvo.id).forEach(t => { t.contatoId = ""; tocar(t); });
    alvo.del = true; delete alvo.pedidoDel;
    registrar(alvo, "x"); tocar(alvo);
    logar("excluiu " + tipo + " “" + rotulo + "”");
    fecharFolha(); mudou(); desenhar(); brinde(tipo === "contato" ? "Contato excluído." : "Tarefa excluída.");
    if(aoTerminar) aoTerminar();
  };

  if(podeExcluir(alvo)){
    abrirFolha('<h2>Excluir '+tipo+'</h2><p>Isso apaga <strong>'+esc(rotulo)+'</strong> para todo mundo do quadro. '
      + 'Fica registrado no histórico de quem apagou.</p>'
      + '<div class="acoes"><button class="btn claro" data-fechar="1">Cancelar</button>'
      + '<button class="btn" id="delConf" style="background:var(--alerta)">Excluir</button></div>');
    document.getElementById("delConf").addEventListener("click", excluir);
    return;
  }

  abrirFolha('<h2>Pedir exclusão</h2>'
    + '<p>A regra deste quadro é que só '+(regraExclusao() === "autor" ? "quem criou" : (nomeDono() || "o responsável"))
    + ' pode apagar. Seu pedido fica visível para '+(nomeDono() || "o responsável")+' aprovar.</p>'
    + '<div class="campo"><label for="delMotivo">Motivo</label>'
    + '<input id="delMotivo" placeholder="Ex.: duplicada, aberta por engano" autocomplete="off"></div>'
    + '<div class="acoes"><button class="btn claro" data-fechar="1">Cancelar</button>'
    + '<button class="btn" id="delPedir">Enviar pedido</button></div>');
  document.getElementById("delPedir").addEventListener("click", () => {
    alvo.pedidoDel = { q: cfg.eu || "sem nome", t: agora(), m: document.getElementById("delMotivo").value.trim() };
    registrar(alvo, "p"); tocar(alvo);
    logar("pediu exclusão de " + tipo + " “" + rotulo + "”");
    fecharFolha(); mudou(); desenhar();
    brinde("Pedido enviado para " + (nomeDono() || "o responsável") + ".");

/** arrasto vertical simples para listas de reordenar */
function ligarOrdenacao(caixa, aoSoltar){
  if(!caixa) return;
  let alvo = null, marcador = null, deslocY = 0;

  const itens = () => [...caixa.querySelectorAll(".item-ord")];
  const idsAtuais = () => itens().map(el => el.dataset.pastaOrd || el.dataset.ordId);

  caixa.addEventListener("pointerdown", e => {
    const punho = e.target.closest(".punho");
    if(!punho) return;
    e.preventDefault();
    alvo = punho.closest(".item-ord");
    const r = alvo.getBoundingClientRect();
    deslocY = e.clientY - r.top;
    marcador = document.createElement("div");
    marcador.className = "vago-ord";
    marcador.style.height = r.height + "px";
    alvo.parentNode.insertBefore(marcador, alvo);
    alvo.classList.add("flutuando");
    alvo.style.width = r.width + "px";
    alvo.style.left = r.left + "px";
    alvo.style.top = r.top + "px";
    document.body.appendChild(alvo);
    try{ punho.setPointerCapture(e.pointerId); }catch(err){}
  });

  caixa.addEventListener("pointermove", e => {
    if(!alvo) return;
    e.preventDefault();
    alvo.style.top = (e.clientY - deslocY) + "px";
    const irmaos = itens().filter(x => x !== alvo);
    let antes = null;
    for(const s of irmaos){
      const rr = s.getBoundingClientRect();
      if(e.clientY < rr.top + rr.height / 2){ antes = s; break; }
    }
    if(antes) caixa.insertBefore(marcador, antes); else caixa.appendChild(marcador);
  });

  const soltar = () => {
    if(!alvo) return;
    alvo.classList.remove("flutuando");
    alvo.style.cssText = "";
    marcador.parentNode.insertBefore(alvo, marcador);
    marcador.remove();
    alvo = null; marcador = null;
    aoSoltar(idsAtuais());
  };
  caixa.addEventListener("pointerup", soltar);
  caixa.addEventListener("pointercancel", soltar);
}

function folhaLogin(passo, email, erro){
  passo = passo || "email";
  if(passo === "email"){
    abrirFolha(
      '<h2>Entrar no quadro</h2>'
      + '<p>Digite seu e-mail. Vamos mandar um código de 6 dígitos para confirmar que é você.</p>'

      + '<div class="acoes"><button class="btn claro" data-fechar="1">Cancelar</button>'
      + '<button class="btn" id="lEnviar">Enviar código</button></div>'
    );
    const inp = document.getElementById("lEmail");
    setTimeout(() => inp.focus(), 250);
    document.getElementById("lEnviar").addEventListener("click", async () => {
      const e = inp.value.trim();
      if(!e || e.indexOf("@") < 1){ brinde("Digite um e-mail válido."); return; }
      const bt = document.getElementById("lEnviar");
      bt.textContent = "Enviando…"; bt.disabled = true;
      try{ await Auth.pedirCodigo(e); folhaLogin("codigo", e); }
      catch(err){ folhaLogin("email", e, String(err.message || err)); }
    });
    return;
  }

  abrirFolha(
    '<h2>Código enviado</h2>'
    + '<p>Procure na caixa de entrada de <strong>'+esc(email)+'</strong>. Confira o spam se demorar.</p>'
    + '<div class="aviso">Chegou um <strong>link</strong> em vez de números? Também serve: toque no link do e-mail que você entra direto, sem precisar digitar nada aqui.</div>'
    + (erro ? '<div class="aviso ruim">'+esc(erro)+'</div>' : '')
    + '<div class="campo"><label for="lCodigo">Código</label>'
    + '<input id="lCodigo" inputmode="numeric" maxlength="10" placeholder="Digite o código do e-mail" autocomplete="one-time-code" '
    + 'style="font-family:var(--mono);font-size:20px;letter-spacing:.22em;text-align:center"></div>'
    + '<div class="acoes"><button class="btn claro" id="lVoltar">Trocar e-mail</button>'
    + '<button class="btn" id="lEntrar">Entrar</button></div>'
    + '<div class="acoes"><button class="btn claro" id="lReenviar">Reenviar código</button></div>'
  );
  const inp = document.getElementById("lCodigo");
  setTimeout(() => inp.focus(), 250);
  const entrar = async () => {

  inp.addEventListener("keydown", ev => { if(ev.key === "Enter") entrar(); });

  document.getElementById("lReenviar").addEventListener("click", async () => {
    try{ await Auth.pedirCodigo(email); brinde("Código reenviado."); }
    catch(err){ brinde(String(err.message || err)); }

function quando(ts){
  if(!ts) return "";
  const d = Math.round((agora() - ts) / 86400000);
  if(d <= 0) return "hoje";
  if(d === 1) return "ontem";
  if(d < 30) return "há " + d + " dias";
  return "há mais de um mês";
}

/** encolhe a imagem escolhida para caber no documento sincronizado */
function encolherImagem(arquivo){
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onerror = () => reject(new Error("não consegui ler o arquivo"));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("arquivo não é uma imagem válida"));
      img.onload = () => {
        const L = 128;
        const c = document.createElement("canvas");
        c.width = L; c.height = L;
        const ctx = c.getContext("2d");
        const escala = Math.min(L / img.width, L / img.height);
        const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
        ctx.drawImage(img, Math.round((L-w)/2), Math.round((L-h)/2), w, h);
        let saida = "";
        try{ saida = c.toDataURL("image/webp", 0.85); }catch(e){}
        if(!saida || saida.indexOf("data:image/webp") !== 0) saida = c.toDataURL("image/png");
        resolve(saida);
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

/* =================== convite da equipe =================== */

function linkConvite(){
  const publico = { u:cfg.url, k:cfg.chave, q:cfg.quadro };   // sem a senha, de propósito
  const frag = "#g=" + btoa(unescape(encodeURIComponent(JSON.stringify(publico))));
  const hospedado = (location.protocol === "http:" || location.protocol === "https:") && location.host;
  const base = hospedado ? location.origin + location.pathname : "";
  return { frag, base, link: base ? base + frag : "", hospedado };
}

/** o link do e-mail devolve a pessoa com os tokens no fim do endereço */
function lerTokenDoLink(){
  const h = location.hash || "";
  if(h.indexOf("access_token=") < 0) return null;
  const p = {};
  h.replace(/^#/, "").split("&").forEach(par => {
    const i = par.indexOf("=");
    if(i > 0) p[par.slice(0,i)] = decodeURIComponent(par.slice(i+1));
  });
  if(!p.access_token) return null;
  return {
    token: p.access_token,
    refresh: p.refresh_token || "",
    expira: agora() + ((parseInt(p.expires_in,10) || 3600) * 1000) - 60000,
    email: "", nome: "", papel: "membro"
  };
}

function lerConvite(){
  const m = /[#&]g=([^&]+)/.exec(location.hash || "");
  if(!m) return null;
  try{ return JSON.parse(decodeURIComponent(escape(atob(m[1])))); }
  catch(e){ return null; }
}

/* =================== diagnóstico =================== */

async function diagnosticar(){
  const alvo = document.getElementById("sDiag");
  if(!alvo) return;
  const url = document.getElementById("sUrl").value.trim().replace(/\/+$/,"");
  const chave = document.getElementById("sChave").value.trim();
  const quadro = document.getElementById("sQuadro").value.trim() || "gabinete";
  const senha = document.getElementById("sSenha").value;
  const linhas = [];
  const pinta = () => { alvo.innerHTML = linhas.join(""); };
  const diga = (ok, txt) => { linhas.push('<div class="diag '+(ok?"ok":"ruim")+'">'+(ok?"✓":"✕")+" "+esc(txt)+"</div>"); pinta(); };
  const nota = txt => { linhas.push('<div class="aviso">'+txt+"</div>"); pinta(); };

  linhas.push('<div class="diag">Testando…</div>'); pinta();
  linhas.length = 0;

  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url))
    diga(false, "Endereço fora do padrão. Precisa ser https://xxxx.supabase.co, sem barra no fim.");
  else diga(true, "Endereço no formato certo.");

  if(!chave){ diga(false, "Falta a chave publicável."); return; }
  if(/^sb_secret_/.test(chave) || /service_role/.test(chave)){
    diga(false, "Essa é uma chave secreta. Nunca use aqui — troque pela publicável.");
    return;
  }

  try{
    const r = await fetch(url + "/rest/v1/", { headers:{ apikey:chave } });
    if(r.status === 401) { diga(false, "O servidor respondeu 401: chave recusada."); return; }
    diga(true, "Servidor respondeu (HTTP " + r.status + ").");
  }catch(e){
    diga(false, "A chamada nem saiu do navegador.");
    nota("Isso quase sempre é o sandbox: rodando dentro do Claude, chamadas para fora podem ser barradas. Baixe este arquivo e abra direto no computador, ou hospede num endereço próprio — aí a sincronização funciona.");
    return;
  }

  try{
    const r = await fetch(url + "/rest/v1/rpc/criar_quadro", { method:"POST", headers:cabecalhos(chave), body:JSON.stringify({ p_id:quadro, p_senha:senha }) });
    const t = await r.text();
    if(r.status === 404){ diga(false, "A função criar_quadro não existe. Rode o supabase-setup.sql no SQL Editor."); return; }
    if(!r.ok){ diga(false, "criar_quadro: HTTP " + r.status + " — " + detalhe(t)); return; }
    diga(true, "Funções instaladas no banco.");
  }catch(e){ diga(false, "Falha em criar_quadro: " + e.message); return; }

  try{
    const r = await fetch(url + "/rest/v1/rpc/versao_quadro", { method:"POST", headers:cabecalhos(chave), body:JSON.stringify({ p_id:quadro, p_senha:senha }) });
    const t = (await r.text()).trim();
    if(!r.ok){ diga(false, "versao_quadro: HTTP " + r.status + " — " + detalhe(t)); return; }
    if(!t || t === "null") diga(false, "Senha do quadro não confere com a que está gravada no servidor.");
    else diga(true, "Senha aceita. Quadro “" + quadro + "” na versão " + t + ". Pode conectar.");
  }catch(e){ diga(false, "Falha em versao_quadro: " + e.message); }
}

function criarPasta(){
  pedirTexto("Nome da nova pasta", "", v => {
    const ordem = (pastas().slice(-1)[0] || { ordem:-1 }).ordem + 1;
    const p = tocar({ id:id("p"), nome:v, ordem });
    estado.pastas[p.id] = p;
    ["Entrada","Em andamento","Concluído"].forEach((nome,i) => {
      const k = tocar({ id:id("k"), pasta:p.id, nome, ordem:i });
      estado.colunas[k.id] = k;
    });
    vista.pasta = p.id; vista.modo = "quadro";
    logar("criou a pasta “" + v + "”");
    mudou(); desenhar();
  });
}

    if(a === "aprovacoes") folhaAprovacoes();
    if(a === "permissoes") folhaPermissoes();
    if(a === "log") folhaLog();
    if(a === "ocultar"){ vista.ocultarFeitas = !vista.ocultarFeitas; fecharFolha(); desenhar(); }
    if(a === "filtrar") folhaFiltro();
    if(a === "marca") folhaMarca();
    if(a === "nova-pasta") criarPasta();
    if(a === "excluir-pasta" && p && !souDono()){ brinde("Só " + (nomeDono() || "o responsável") + " pode excluir pastas."); return; }
    if(a === "excluir-pasta" && p){
      const n = colunas(p.id).reduce((s,k) => s + pendentes(k.id).length, 0);
      abrirFolha('<h2>Excluir pasta</h2><p>Isso apaga <strong>'+esc(p.nome)+'</strong> e '+n+' tarefa'+(n===1?"":"s")+' para todo mundo do quadro.</p>'
        + '<div class="acoes"><button class="btn claro" data-fechar="1">Cancelar</button>'
        + '<button class="btn" id="confDel" style="background:var(--alerta)">Excluir</button></div>');
      document.getElementById("confDel").addEventListener("click", () => {
        colunas(p.id).forEach(k => { cartoes(k.id).forEach(c => { c.del = true; tocar(c); }); k.del = true; tocar(k); });
        p.del = true; tocar(p);
        logar("excluiu a pasta “" + p.nome + "”");
        vista.pasta = null; fecharFolha(); mudou(); desenhar(); brinde("Pasta excluída.");
      });
    }
    if(a === "titulo") pedirTexto("Título do app", estado.titulo, v => {
      estado.titulo = v; estado.tituloMod = agora(); mudou(); desenhar();
    });
    if(a === "exportar"){
      const blob = new Blob([JSON.stringify(estado, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement("a");
      a2.href = url; a2.download = "central-gabinete-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      fecharFolha(); brinde("Backup exportado.");
    }
    if(a === "csv"){
      const lista = agenda();
      if(!lista.length){ brinde("Nenhum contato para exportar."); return; }
      const campo = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const linhas = [["Nome","Telefone","E-mail","Bairro","Origem","Autorizou contato","Observações","Atendimentos"]
        .map(campo).join(";")];
      lista.forEach(k => linhas.push([k.nome, k.fone, k.email, k.bairro, k.origem,
        k.autoriza ? "sim" : "não", k.notas, atendimentosDe(k.id).length].map(campo).join(";")));
      const blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type:"text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a3 = document.createElement("a");
      a3.href = url; a3.download = "contatos-gabinete-" + new Date().toISOString().slice(0,10) + ".csv";
      document.body.appendChild(a3); a3.click(); a3.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      fecharFolha(); brinde(lista.length + " contatos exportados.");
    }
    if(a === "importar") document.getElementById("arquivo").click();
    return;
  }

  const aprovar = e.target.closest("[data-aprovar]");
  if(aprovar){
    const alvo = estado.cartoes[aprovar.dataset.aprovar] || (estado.contatos || {})[aprovar.dataset.aprovar]
               || (estado.pessoal || {})[aprovar.dataset.aprovar];
    if(alvo && souDono()){
      const tipo = estado.cartoes[aprovar.dataset.aprovar] ? "tarefa" : "contato";
      if(tipo === "contato") atendimentosDe(alvo.id).forEach(t => { t.contatoId = ""; tocar(t); });
      alvo.del = true; delete alvo.pedidoDel;
      registrar(alvo, "x"); tocar(alvo);
      logar("aprovou a exclusão de " + tipo + " “" + (alvo.titulo || alvo.nome) + "”");
      mudou(); desenhar(); folhaAprovacoes(); brinde("Exclusão aprovada.");
    }
    return;
  }
  const recusar = e.target.closest("[data-recusar]");
  if(recusar){
    const alvo = estado.cartoes[recusar.dataset.recusar] || (estado.contatos || {})[recusar.dataset.recusar]
               || (estado.pessoal || {})[recusar.dataset.recusar];
    if(alvo && souDono()){
      delete alvo.pedidoDel;
      registrar(alvo, "n"); tocar(alvo);
      logar("recusou a exclusão de “" + (alvo.titulo || alvo.nome) + "”");

  const feitoBt = e.target.closest("[data-feito]");
  if(feitoBt){
    e.stopPropagation();
    const c = estado.cartoes[feitoBt.dataset.feito];
    if(c){
      if(c.feito){ c.feito = 0; registrar(c, "r"); }
      else { c.feito = agora(); registrar(c, "f"); }
      tocar(c); mudou(); desenhar();
    }
    return;
  }

  const tirar = e.target.closest("[data-tirar]");
  if(tirar){
    e.stopPropagation();
    const m = quem(tirar.dataset.tirar);
    if(m){ m.del = true; m.mod = agora(); if(vista.resp === m.id) vista.resp = null; mudou(); desenhar(); }
    folhaEquipe();

  }
  const filtrar = e.target.closest("[data-filtrar]");
  if(filtrar){

    fecharFolha(); desenhar();

  const membroBt = e.target.closest("[data-membro]");

  }

  const finalBt = e.target.closest("[data-final]");
  if(finalBt){
    e.stopPropagation();
    const k = estado.colunas[finalBt.dataset.final];
    if(k){
      k.final = !k.final; tocar(k);
      cartoes(k.id).forEach(c => { ajustarFeito(c, k.final ? null : k.id); tocar(c); });
      logar((k.final ? "marcou" : "desmarcou") + " a coluna “" + k.nome + "” como encerramento");
      mudou(); desenhar(); folhaColunas();
    }
    return;
  }

  const del = e.target.closest("[data-del]");
  if(del){
    e.stopPropagation();
    const k = estado.colunas[del.dataset.del];
    if(!souDono()){ brinde("Só " + (nomeDono() || "o responsável") + " pode excluir colunas."); return; }
    if(colunas(vista.pasta).length < 2){ brinde("Mantenha ao menos uma coluna."); return; }
    cartoes(k.id).forEach(c => { c.del = true; tocar(c); });
    k.del = true; tocar(k);
    logar("excluiu a coluna “" + k.nome + "”");
    mudou(); desenhar(); folhaColunas();
    return;
  }
  const renP = e.target.closest("[data-renomear-pasta]");
  if(renP){
    const p = estado.pastas[renP.dataset.renomearPasta];
    if(p) pedirTexto("Nome da pasta", p.nome, v => {
      logar("renomeou a pasta “" + p.nome + "” para “" + v + "”");
      p.nome = v; tocar(p); mudou(); desenhar(); folhaPastas();
    });
    return;
  }
  const linkP = e.target.closest("[data-link-pasta]");
  if(linkP){ folhaLinkDrive("pasta", linkP.dataset.linkPasta); return; }

  const col = e.target.closest("[data-col]");
  if(col){
    const k = estado.colunas[col.dataset.col];
    pedirTexto("Nome da coluna", k.nome, v => { k.nome = v; tocar(k); mudou(); desenhar(); });
    return;
  }

  const aba = e.target.closest(".aba");
  if(aba){
    if(aba.dataset.nova){ criarPasta(); return; }
    if(aba.dataset.limpafiltro){ vista.resp = null; desenhar(); return; }
    document.getElementById("barraBusca").classList.remove("on");
    vista.busca = "";
    if(aba.dataset.prazos) vista.modo = "prazos";
    else if(aba.dataset.contatos) vista.modo = "contatos";
    else if(aba.dataset.admin) vista.modo = "admin";
    else if(aba.dataset.pessoal) vista.modo = "pessoal";
    else { vista.pasta = aba.dataset.pasta; vista.modo = "quadro"; }
    desenhar();
    return;
  }

  const add = e.target.closest("[data-addcol]");
  if(add){ folhaCartao(null, add.dataset.addcol); return; }

  const lancBt = e.target.closest("[data-lanc]");
  if(lancBt){ folhaLancamento(lancBt.dataset.lanc); return; }
  const pessoaBt = e.target.closest("[data-pessoa]");
  if(pessoaBt){ folhaPessoa(pessoaBt.dataset.pessoa); return; }

  const fichaBt = e.target.closest("[data-contato]");
  if(fichaBt){ folhaContato(fichaBt.dataset.contato); return; }

  const vp = e.target.closest("[data-vprazo]");
  if(vp){ vista.prazoVista = vp.dataset.vprazo; vista.diaPrazo = null; desenharPrazos(); return; }

  const linha = e.target.closest(".linha-item");
  if(linha){ folhaCartao(linha.dataset.cartao); return; }

  if(e.target.closest("a.drive, a.faixa-drive")) return;   // deixa o link abrir sozinho

  const cartao = e.target.closest(".cartao");
  if(cartao && !arrastou){ folhaCartao(cartao.dataset.cartao); return; }
});

(function ligarSetas(){
  const nav = document.getElementById("abas");
  const passo = () => Math.max(120, Math.round(nav.clientWidth * 0.7));
  document.getElementById("setaE").addEventListener("click", () => {
    nav.scrollBy({ left:-passo(), behavior:"smooth" });
  });
  document.getElementById("setaD").addEventListener("click", () => {
    nav.scrollBy({ left:passo(), behavior:"smooth" });
  });
  nav.addEventListener("scroll", ajustarSetas);
  window.addEventListener("resize", ajustarSetas);
  // a roda do mouse percorre as abas quando o cursor está sobre elas
  nav.addEventListener("wheel", ev => {
    if(Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    nav.scrollLeft += ev.deltaY;
    ev.preventDefault();
  }, { passive:false });
})();

/** no computador, a roda do mouse percorre as colunas lado a lado */
document.addEventListener("wheel", e => {
  const trilho = document.getElementById("trilho");
  if(!trilho || !trilho.contains(e.target)) return;
  if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  const lista = e.target.closest ? e.target.closest(".lista") : null;
  if(lista && lista.scrollHeight > lista.clientHeight + 2){
    const noTopo = lista.scrollTop <= 0;
    const noFim = lista.scrollTop + lista.clientHeight >= lista.scrollHeight - 1;
    // só assume a rolagem horizontal depois que a coluna chegou ao fim
    if(!((e.deltaY < 0 && noTopo) || (e.deltaY > 0 && noFim))) return;
  }
  trilho.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive:false });
